<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belluna Pet Alpha - 로그인</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase JS SDK (필수) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 flex flex-col min-h-screen justify-between">

    <!-- Header -->
    <header class="border-b border-slate-800 p-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-2">
                <img src="beluna_logo.png" alt="Belluna Pet Logo" class="h-8 w-auto">
                <span class="text-lg font-black text-amber-400">Belluna Pet</span>
            </a>
            <a href="index.html" class="text-xs text-slate-400 hover:text-white transition">🏠 메인으로 돌아가기</a>
        </div>
    </header>

    <!-- Login Form Section -->
    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="w-full max-w-md bg-slate-950 border border-slate-800 rounded-2xl p-8 shadow-2xl">
            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold text-slate-100">벨루나펫 로그인</h1>
                <p class="text-xs text-slate-400 mt-2">한국애견연맹과 함께하는 회원 전용 서비스를 이용해보세요.</p>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">이메일 계정</label>
                    <input type="email" id="email" required placeholder="example@email.com" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-amber-400 transition">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">비밀번호</label>
                    <input type="password" id="password" required placeholder="비밀번호 입력" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-amber-400 transition">
                </div>

                <div class="flex items-center justify-between text-xs text-slate-400 pt-1">
                    <label class="flex items-center space-x-2 cursor-pointer">
                        <input type="checkbox" id="rememberMe" class="rounded bg-slate-900 border-slate-700 text-amber-400 focus:ring-0">
                        <span>로그인 상태 유지</span>
                    </label>
                    <a href="#" class="hover:text-amber-400 transition">비밀번호 찾기</a>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-amber-400 text-slate-950 font-bold py-3.5 rounded-lg text-sm hover:bg-amber-300 transition shadow-lg mt-2">
                    로그인하기
                </button>
            </form>

            <div class="mt-6 text-center text-xs text-slate-400">
                아직 벨루나펫 회원이 아니신가요? 
                <a href="signup.html" class="text-amber-400 font-bold hover:underline ml-1">회원가입하기</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 py-4 text-center text-xs text-slate-500">
        © Belluna Pet. All rights reserved.
    </footer>

    <script>
        // =========================================================
        // 1. Supabase 연동 정보
        // =========================================================
        const SUPABASE_URL = 'https://qemfpmnsywfzuyzozkqj.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_m6B4hq2B-txvZ09ha5bLrQ_CG7HcnhS';

        // Supabase 클라이언트 생성
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // =========================================================
        // 2. 로그인 처리 함수
        // =========================================================
        async function handleLogin(e) {
            e.preventDefault();

            const emailInput = document.getElementById('email').value.trim();
            const passwordInput = document.getElementById('password').value;
            const submitBtn = document.getElementById('submitBtn');

            submitBtn.disabled = true;
            submitBtn.innerText = '로그인 중...';

            try {
                // Supabase Auth 비밀번호 로그인 API
                const { data, error } = await _supabase.auth.signInWithPassword({
                    email: emailInput,
                    password: passwordInput
                });

                if (error) {
                    alert('로그인 실패: ' + error.message);
                } else {
                    // 로그인한 사용자 정보 추출 (회원가입 시 넣은 metadata 이름 포함)
                    const user = data.user;
                    const userName = user.user_metadata?.name || '회원';

                    // 브라우저 저장소에 세션 정보 보관
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('userEmail', user.email);
                    localStorage.setItem('userName', userName);

                    alert(`${userName}님, 반갑습니다! 로그인되었습니다.`);
                    window.location.href = 'index.html';
                }
            } catch (err) {
                console.error('Supabase Login Error:', err);
                alert('오류가 발생했습니다. 잠시 후 다시 시도해 주세요.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = '로그인하기';
            }
        }
    </script>
</body>
</html>
