<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belluna Pet Alpha - 로그인</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 flex flex-col min-h-screen justify-between">

    <!-- Header -->
    <header class="border-b border-slate-800 p-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-2">
                <img src="beluna_logo.png" alt="Belluna Pet Logo" class="h-8 w-auto">
                <span class="text-lg font-black text-amber-400">Belluna Pet</span>
            </a>
            <a href="signup.html" class="text-xs text-slate-400 hover:text-white transition">📝 회원가입으로 이동</a>
        </div>
    </header>

    <!-- Login Form Section -->
    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="w-full max-w-md bg-slate-950 border border-slate-800 rounded-2xl p-8 shadow-2xl">
            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold text-slate-100">벨루나펫 로그인</h1>
                <p class="text-xs text-slate-400 mt-2">서비스 이용을 위해 계정 정보를 입력해 주세요.</p>
            </div>

            <form onsubmit="handleSignIn(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">이메일 계정</label>
                    <input type="email" id="email" required placeholder="example@email.com" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-amber-400 transition">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">비밀번호</label>
                    <input type="password" id="password" required placeholder="비밀번호 입력" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-amber-400 transition">
                </div>

                <div class="flex items-center justify-between text-xs pt-1">
                    <label class="flex items-center text-slate-400 cursor-pointer select-none">
                        <input type="checkbox" id="remember-me" class="rounded border-slate-700 bg-slate-900 text-amber-400 focus:ring-amber-400 mr-2">
                        로그인 상태 유지
                    </label>
                    <a href="#" onclick="alert('비밀번호 재설정 기능은 준비 중입니다.'); return false;" class="text-slate-400 hover:text-slate-200 underline">비밀번호 찾기</a>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-amber-400 text-slate-950 font-bold py-3.5 rounded-lg text-sm hover:bg-amber-300 transition shadow-lg mt-4">
                    로그인하기
                </button>
            </form>

            <div class="mt-6 text-center text-xs text-slate-400">
                아직 계정이 없으신가요? 
                <a href="signup.html" class="text-amber-400 font-bold hover:underline ml-1">회원가입하기</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 py-4 text-center text-xs text-slate-500">
        © Belluna Pet. All rights reserved.
    </footer>

    <script>
        // =========================================================
        // 1. Supabase 연동 정보
        // =========================================================
        const SUPABASE_URL = 'https://qemfpmnsywfzuyzozkqj.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_m6B4hq2B-txvZ09ha5bLrQ_CG7HcnhS';

        // =========================================================
        // 2. Supabase 에러 메시지 한글 변환 함수
        // =========================================================
        function getKoreanErrorMessage(error) {
            if (!error || !error.message) return '로그인 중 오류가 발생했습니다.';

            const msg = error.message.toLowerCase();

            if (msg.includes('invalid login credentials')) {
                return '이메일 또는 비밀번호가 일치하지 않습니다.';
            }
            if (msg.includes('email not confirmed')) {
                return '이메일 인증이 완료되지 않았습니다. 이메일을 확인해 주세요.';
            }
            if (msg.includes('user not found')) {
                return '등록되지 않은 이메일 계정입니다.';
            }
            if (msg.includes('too many requests') || msg.includes('rate limit')) {
                return '시도 횟수가 너무 많습니다. 잠시 후 다시 시도해 주세요.';
            }

            return '로그인에 실패했습니다: ' + error.message;
        }

        // 인증 Key 선택적 삭제 함수
        function clearAuthKeys(storage) {
            storage.removeItem('isLoggedIn');
            storage.removeItem('userEmail');
            storage.removeItem('userName');
        }

        // =========================================================
        // 3. 로그인 처리 함수
        // =========================================================
        async function handleSignIn(e) {
            e.preventDefault();

            const emailInput = document.getElementById('email').value.trim();
            const passwordInput = document.getElementById('password').value;
            const isRememberMe = document.getElementById('remember-me').checked;
            const submitBtn = document.getElementById('submitBtn');

            submitBtn.disabled = true;
            submitBtn.innerText = '로그인 중...';

            try {
                // '로그인 상태 유지' 체크 여부에 따라 대상 스토리지 분기
                const targetStorage = isRememberMe ? window.localStorage : window.sessionStorage;
                const oppositeStorage = isRememberMe ? window.sessionStorage : window.localStorage;

                clearAuthKeys(oppositeStorage);
                clearAuthKeys(targetStorage);

                const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                    auth: {
                        storage: targetStorage,
                        persistSession: true,
                        autoRefreshToken: true
                    }
                });

                const { data, error } = await client.auth.signInWithPassword({
                    email: emailInput,
                    password: passwordInput,
                });

                if (error) {
                    alert(getKoreanErrorMessage(error));
                } else {
                    // 세션 및 상태값 저장
                    targetStorage.setItem('isLoggedIn', 'true');
                    targetStorage.setItem('userEmail', data.user.email);
                    
                    if (data.user.user_metadata && data.user.user_metadata.name) {
                        targetStorage.setItem('userName', data.user.user_metadata.name);
                    }

                    alert((data.user.user_metadata?.name || '회원') + '님, 환영합니다!');
                    window.location.href = 'index.html';
                }
            } catch (err) {
                console.error('Supabase Sign In Error:', err);
                alert('네트워크 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = '로그인하기';
            }
        }
    </script>
</body>
</html>
