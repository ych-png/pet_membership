<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belluna Pet Alpha - 회원가입</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 flex flex-col min-h-screen justify-between">

    <!-- Header -->
    <header class="border-b border-slate-800 p-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-2">
                <img src="beluna_logo.png" alt="Belluna Pet Logo" class="h-8 w-auto">
                <span class="text-lg font-black text-amber-400">Belluna Pet</span>
            </a>
            <a href="index.html" class="text-xs text-slate-400 hover:text-white transition">🏠 메인으로 돌아가기</a>
        </div>
    </header>

    <!-- Signup Form Section -->
    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="w-full max-w-lg bg-slate-950 border border-slate-800 rounded-2xl p-8 shadow-2xl">
            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold text-slate-100">회원가입</h1>
                <p class="text-xs text-slate-400 mt-2">한국애견연맹 제휴 혜택과 특가 공동구매를 만나보세요.</p>
            </div>

            <form onsubmit="handleSignup(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">이름</label>
                    <input type="text" required placeholder="홍길동" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-amber-400 transition">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">이메일 주소</label>
                    <input type="email" required placeholder="example@email.com" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-amber-400 transition">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">비밀번호</label>
                    <input type="password" required placeholder="영문, 숫자 포함 8자 이상" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-amber-400 transition">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">휴대폰 번호</label>
                    <input type="tel" required placeholder="010-0000-0000" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-amber-400 transition">
                </div>

                <!-- 약관 동의 -->
                <div class="pt-2 border-t border-slate-800 space-y-2 text-xs text-slate-400">
                    <label class="flex items-center space-x-2 cursor-pointer">
                        <input type="checkbox" required class="rounded bg-slate-900 border-slate-700 text-amber-400 focus:ring-0">
                        <span>[필수] 이용약관 및 개인정보 처리방침 동의</span>
                    </label>
                    <label class="flex items-center space-x-2 cursor-pointer">
                        <input type="checkbox" class="rounded bg-slate-900 border-slate-700 text-amber-400 focus:ring-0">
                        <span>[선택] 혜택 및 이벤트 정보 알림 수신 동의</span>
                    </label>
                </div>

                <button type="submit" class="w-full bg-amber-400 text-slate-950 font-bold py-3.5 rounded-lg text-sm hover:bg-amber-300 transition shadow-lg mt-4">
                    가입 완료하기
                </button>
            </form>

            <div class="mt-6 text-center text-xs text-slate-400">
                이미 계정이 있으신가요? 
                <a href="login.html" class="text-amber-400 font-bold hover:underline ml-1">로그인하기</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 py-4 text-center text-xs text-slate-500">
        © Belluna Pet. All rights reserved.
    </footer>

    <script>
        function handleSignup(e) {
            e.preventDefault();
            alert('가입이 성공적으로 완료되었습니다! 로그인 페이지로 이동합니다.');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
