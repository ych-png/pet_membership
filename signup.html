<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belluna Pet Alpha - 회원가입</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Daum(Kakao) 우편번호 서비스 공식 스크립트 -->
    <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>

    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 flex flex-col min-h-screen justify-between">

    <!-- Header -->
    <header class="border-b border-slate-800 p-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-2">
                <img src="beluna_logo.png" alt="Belluna Pet Logo" class="h-8 w-auto">
                <span class="text-lg font-black text-amber-400">Belluna Pet</span>
            </a>
            <a href="login.html" class="text-xs text-slate-400 hover:text-white transition">🔐 로그인으로 이동</a>
        </div>
    </header>

    <!-- Signup Form Section -->
    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="w-full max-w-lg bg-slate-950 border border-slate-800 rounded-2xl p-8 shadow-2xl">
            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold text-slate-100">벨루나펫 회원가입</h1>
                <p class="text-xs text-slate-400 mt-2">한국애견연맹과 함께하는 회원 전용 서비스를 이용해보세요.</p>
            </div>

            <form onsubmit="handleSignUp(event)" class="space-y-4">
                <!-- 이름 -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">이름</label>
                    <input type="text" id="name" required oninput="validateForm()" placeholder="홍길동" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-amber-400 transition">
                </div>

                <!-- 아이디 및 중복확인 버튼 -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">아이디</label>
                    <div class="flex gap-2">
                        <input type="text" id="username" required oninput="onUsernameInput()" placeholder="영문/숫자 조합 4~12자" class="flex-grow bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-amber-400 transition">
                        <button type="button" onclick="checkUsernameDuplicate()" id="usernameCheckBtn" class="bg-slate-800 hover:bg-slate-700 text-amber-400 border border-slate-700 text-xs font-bold px-4 rounded-lg transition whitespace-nowrap">
                            중복확인
                        </button>
                    </div>
                    <p id="usernameStatus" class="text-xs mt-1.5 hidden flex items-center gap-1"></p>
                </div>

                <!-- 비밀번호 -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">비밀번호</label>
                    <input type="password" id="password" required oninput="onPasswordInput()" placeholder="6자 이상 입력" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-amber-400 transition">
                </div>

                <!-- 비밀번호 확인 -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">비밀번호 확인</label>
                    <input type="password" id="confirmPassword" required oninput="onPasswordInput()" placeholder="비밀번호 다시 입력" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-amber-400 transition">
                    <!-- 비밀번호 일치 여부 메시지 -->
                    <p id="passwordMatchStatus" class="text-xs mt-1.5 hidden flex items-center gap-1"></p>
                </div>

                <!-- 전화번호 -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">전화번호</label>
                    <input type="tel" id="phone" required maxlength="13" oninput="formatPhoneNumber(this); validateForm();" placeholder="010-1234-5678" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-amber-400 transition">
                </div>

                <!-- 주소 (카카오 우편번호 검색 및 상세주소) -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">주소</label>
                    <div class="flex gap-2 mb-2">
                        <input type="text" id="postcode" readonly placeholder="우편번호" class="w-32 bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-slate-300 focus:outline-none">
                        <button type="button" onclick="execDaumPostcode()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-semibold px-4 rounded-lg transition whitespace-nowrap">
                            <i class="fa-solid fa-magnifying-glass mr-1"></i> 우편번호 검색
                        </button>
                    </div>
                    <input type="text" id="address" readonly placeholder="기본 주소" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-slate-300 focus:outline-none mb-2">
                    <input type="text" id="detailAddress" required oninput="validateForm()" placeholder="상세 주소를 입력해 주세요" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-amber-400 transition">
                </div>

                <!-- 필수 항목 완료 전에는 비활성화(disabled)되는 가입 버튼 -->
                <button type="submit" id="submitBtn" disabled class="w-full bg-slate-700 text-slate-400 font-bold py-3.5 rounded-lg text-sm transition shadow-lg mt-4 cursor-not-allowed">
                    모든 항목을 입력하고 아이디 중복확인을 완료해주세요
                </button>
            </form>

            <div class="mt-6 text-center text-xs text-slate-400">
                이미 계정이 있으신가요? 
                <a href="login.html" class="text-amber-400 font-bold hover:underline ml-1">로그인하기</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 py-4 text-center text-xs text-slate-500">
        © Belluna Pet. All rights reserved.
    </footer>

    <script>
        const SUPABASE_URL = 'https://qemfpmnsywfzuyzozkqj.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_m6B4hq2B-txvZ09ha5bLrQ_CG7HcnhS';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isUsernameChecked = false;

        // 전화번호 하이픈 자동 입력
        function formatPhoneNumber(input) {
            let value = input.value.replace(/[^0-9]/g, '');
            if (value.length > 11) value = value.substring(0, 11);

            if (value.length < 4) {
                input.value = value;
            } else if (value.length < 7) {
                input.value = `${value.substring(0, 3)}-${value.substring(3)}`;
            } else if (value.length < 11) {
                input.value = `${value.substring(0, 3)}-${value.substring(3, 6)}-${value.substring(6)}`;
            } else {
                input.value = `${value.substring(0, 3)}-${value.substring(3, 7)}-${value.substring(7)}`;
            }
        }

        // 아이디 입력 변경 시 중복 확인 상태 초기화
        function onUsernameInput() {
            isUsernameChecked = false;
            const status = document.getElementById('usernameStatus');
            status.classList.add('hidden');
            validateForm();
        }

        // 아이디 중복 확인 기능
        async function checkUsernameDuplicate() {
            const usernameInput = document.getElementById('username').value.trim();
            const status = document.getElementById('usernameStatus');

            if (!usernameInput || usernameInput.length < 4) {
                status.className = "text-xs text-red-400 mt-1.5 flex items-center gap-1";
                status.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> 아이디는 4자 이상 입력해 주세요.`;
                status.classList.remove('hidden');
                return;
            }

            try {
                const { data, error } = await _supabase
                    .from('profiles')
                    .select('username')
                    .eq('username', usernameInput)
                    .maybeSingle();

                if (error) {
                    console.error('중복 체크 쿼리 에러:', error);
                    alert('중복 체크 중 DB 오류가 발생했습니다: ' + error.message);
                    return;
                }

                if (data) {
                    isUsernameChecked = false;
                    status.className = "text-xs text-red-400 mt-1.5 flex items-center gap-1";
                    status.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> 이미 사용 중인 아이디입니다.`;
                    status.classList.remove('hidden');
                } else {
                    isUsernameChecked = true;
                    status.className = "text-xs text-green-400 mt-1.5 flex items-center gap-1";
                    status.innerHTML = `<i class="fa-solid fa-check"></i> 사용 가능한 아이디입니다.`;
                    status.classList.remove('hidden');
                    validateForm();
                }
            } catch (err) {
                console.error('아이디 중복 체크 예외:', err);
                alert('중복 체크 중 오류가 발생했습니다.');
            }
        }

        // 비밀번호 및 비밀번호 확인 실시간 검사 함수
        function onPasswordInput() {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const matchStatus = document.getElementById('passwordMatchStatus');

            if (confirmPassword.length > 0) {
                matchStatus.classList.remove('hidden');
                if (password === confirmPassword) {
                    matchStatus.className = "text-xs text-green-400 mt-1.5 flex items-center gap-1";
                    matchStatus.innerHTML = `<i class="fa-solid fa-check"></i> 비밀번호가 일치합니다.`;
                } else {
                    matchStatus.className = "text-xs text-red-400 mt-1.5 flex items-center gap-1";
                    matchStatus.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> 비밀번호가 일치하지 않습니다.`;
                }
            } else {
                matchStatus.classList.add('hidden');
            }

            validateForm();
        }

        // 카카오 우편번호 팝업 호출
        function execDaumPostcode() {
            if (typeof daum === 'undefined' || !daum.Postcode) {
                alert('우편번호 서비스 스크립트가 아직 로드되지 않았습니다. 잠시 후 다시 시도해 주세요.');
                return;
            }

            new daum.Postcode({
                oncomplete: function(data) {
                    let addr = data.userSelectedType === 'R' ? data.roadAddress : data.jibunAddress;
                    document.getElementById('postcode').value = data.zonecode;
                    document.getElementById('address').value = addr;
                    document.getElementById('detailAddress').focus();
                    validateForm();
                }
            }).open();
        }

        // 필수 항목 작성 및 아이디 중복확인 완료 여부 검사
        function validateForm() {
            const name = document.getElementById('name').value.trim();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const phone = document.getElementById('phone').value.trim();
            const postcode = document.getElementById('postcode').value.trim();
            const detailAddress = document.getElementById('detailAddress').value.trim();
            
            const submitBtn = document.getElementById('submitBtn');

            const isAllFilled = name && username && password && confirmPassword && phone && postcode && detailAddress;
            const isPasswordValid = password.length >= 6 && (password === confirmPassword);

            if (isAllFilled && isPasswordValid && isUsernameChecked) {
                submitBtn.disabled = false;
                submitBtn.className = "w-full bg-amber-400 text-slate-950 font-bold py-3.5 rounded-lg text-sm hover:bg-amber-300 transition shadow-lg mt-4 cursor-pointer";
                submitBtn.innerText = "가입 완료하기";
            } else {
                submitBtn.disabled = true;
                submitBtn.className = "w-full bg-slate-700 text-slate-400 font-bold py-3.5 rounded-lg text-sm transition shadow-lg mt-4 cursor-not-allowed";
                
                if (!isUsernameChecked) {
                    submitBtn.innerText = "아이디 중복확인을 진행해 주세요";
                } else if (!isAllFilled) {
                    submitBtn.innerText = "모든 필수 항목을 입력해 주세요";
                } else if (password.length < 6) {
                    submitBtn.innerText = "비밀번호는 6자 이상이어야 합니다";
                } else if (password !== confirmPassword) {
                    submitBtn.innerText = "비밀번호가 일치하지 않습니다";
                }
            }
        }

        ['name', 'detailAddress'].forEach(id => {
            document.getElementById(id).addEventListener('input', validateForm);
        });

        // ★ [회원가입 최종 완료 버튼 클릭 시] profiles 테이블에 직접 INSERT 및 상세 에러 로깅
        async function handleSignUp(e) {
            e.preventDefault();

            const nameInput = document.getElementById('name').value.trim();
            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value;
            const phoneInput = document.getElementById('phone').value.trim();
            const postcode = document.getElementById('postcode').value.trim();
            const address = document.getElementById('address').value.trim();
            const detailAddress = document.getElementById('detailAddress').value.trim();

            const fullAddress = `[${postcode}] ${address} ${detailAddress}`;

            try {
                console.log("데이터 저장 시도 중...", { username: usernameInput, name: nameInput, phone: phoneInput, address: fullAddress });

                const { data, error } = await _supabase
                    .from('profiles')
                    .insert([
                        {
                            username: usernameInput,
                            name: nameInput,
                            password: passwordInput,
                            phone: phoneInput,
                            address: fullAddress
                        }
                    ]);

                if (error) {
                    console.error('Supabase INSERT 에러 발생:', error);
                    alert('회원가입 처리 실패: ' + error.message);
                    return;
                }

                console.log("데이터 저장 성공:", data);

                localStorage.setItem('userName', nameInput);
                localStorage.setItem('userPhone', phoneInput);
                localStorage.setItem('userUsername', usernameInput);

                alert('회원가입이 성공적으로 완료되었습니다! 로그인 페이지로 이동합니다.');
                window.location.href = 'login.html';

            } catch (err) {
                console.error('회원가입 실행 중 예외 발생:', err);
                alert('회원가입 중 오류가 발생했습니다. 개발자 도구(F12) 콘솔을 확인해주세요.');
            }
        }
    </script>
</body>
</html>
