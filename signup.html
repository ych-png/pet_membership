<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belluna Pet Alpha - 회원가입</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Daum(Kakao) 우편번호 서비스 공식 스크립트 -->
    <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>

    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 flex flex-col min-h-screen justify-between">

    <!-- Header -->
    <header class="border-b border-slate-800 p-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-2">
                <img src="beluna_logo.png" alt="Belluna Pet Logo" class="h-8 w-auto">
                <span class="text-lg font-black text-amber-400">Belluna Pet</span>
            </a>
            <a href="login.html" class="text-xs text-slate-400 hover:text-white transition">🔐 로그인으로 이동</a>
        </div>
    </header>

    <!-- Signup Form Section -->
    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="w-full max-w-lg bg-slate-950 border border-slate-800 rounded-2xl p-8 shadow-2xl space-y-6">
            <div class="text-center space-y-1">
                <h1 class="text-2xl font-black text-amber-400">회원가입</h1>
                <p class="text-xs text-slate-400">Belluna Pet 멤버십에 가입하고 다양한 혜택을 누리세요.</p>
            </div>

            <form id="signupForm" onsubmit="handleSignUp(event)" class="space-y-4 text-xs">
                <!-- 아이디 & 중복확인 (모바일 대응 flex-col 적용) -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">아이디</label>
                    <div class="flex flex-col sm:flex-row gap-2">
                        <input type="text" id="username" required placeholder="영문, 숫자 조합 4~12자" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-amber-400">
                        <button type="button" onclick="checkDuplicateUsername()" class="w-full sm:w-auto bg-slate-800 hover:bg-slate-700 text-amber-400 border border-slate-700 text-xs font-bold px-4 py-2.5 rounded-lg transition whitespace-nowrap shrink-0">
                            중복확인
                        </button>
                    </div>
                    <p id="id-check-msg" class="text-[11px] mt-1 text-slate-500">아이디 중복확인을 진행해 주세요.</p>
                </div>

                <!-- 비밀번호 -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">비밀번호</label>
                    <input type="password" id="password" required placeholder="6자 이상 입력" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-amber-400">
                </div>

                <!-- 비밀번호 확인 -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">비밀번호 확인</label>
                    <input type="password" id="confirmPassword" required placeholder="비밀번호 재입력" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-amber-400">
                    <p id="pw-match-msg" class="text-[11px] mt-1 text-slate-500"></p>
                </div>

                <!-- 이름 -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">이름</label>
                    <input type="text" id="name" required placeholder="실명 입력" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-amber-400">
                </div>

                <!-- 전화번호 -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">전화번호</label>
                    <input type="tel" id="phone" required maxlength="13" oninput="formatPhoneNumber(this)" placeholder="010-0000-0000" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-amber-400">
                </div>

                <!-- 주소 (우편번호 검색) -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">주소</label>
                    <div class="flex gap-2 mb-2">
                        <input type="text" id="postcode" readonly placeholder="우편번호" class="w-28 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-300">
                        <button type="button" onclick="execDaumPostcode()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-semibold px-3 rounded-lg transition whitespace-nowrap">
                            우편번호 검색
                        </button>
                    </div>
                    <input type="text" id="address" readonly placeholder="기본 주소" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-300 mb-2">
                    <input type="text" id="detailAddress" placeholder="상세 주소 입력" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-amber-400">
                </div>

                <!-- 가입 완료 버튼 -->
                <div class="pt-4">
                    <button type="submit" id="submitBtn" disabled class="w-full bg-slate-700 text-slate-400 font-bold py-3.5 rounded-lg text-sm transition shadow-lg mt-4 cursor-not-allowed">
                        아이디 중복확인을 진행해 주세요
                    </button>
                </div>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
        <p>© Belluna Pet. All rights reserved.</p>
    </footer>

    <!-- Supabase 연동 및 회원가입 로직 스크립트 -->
    <script>
        const SUPABASE_URL = 'https://qemfpmnsywfzuyzozkqj.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_m6B4hq2B-txvZ09ha5bLrQ_CG7HcnhS';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isUsernameChecked = false;

        function formatPhoneNumber(input) {
            let value = input.value.replace(/[^0-9]/g, '');
            if (value.length > 11) value = value.substring(0, 11);
            let formatted = value;
            if (value.length >= 4 && value.length < 7) {
                formatted = `${value.substring(0, 3)}-${value.substring(3)}`;
            } else if (value.length >= 7 && value.length < 11) {
                formatted = `${value.substring(0, 3)}-${value.substring(3, 6)}-${value.substring(6)}`;
            } else if (value.length >= 11) {
                formatted = `${value.substring(0, 3)}-${value.substring(3, 7)}-${value.substring(7)}`;
            }
            input.value = formatted;
            validateForm();
        }

        async function checkDuplicateUsername() {
            const username = document.getElementById('username').value.trim();
            const msgEl = document.getElementById('id-check-msg');

            if (!username || username.length < 4) {
                msgEl.textContent = '아이디는 최소 4자 이상 입력해 주세요.';
                msgEl.className = 'text-[11px] mt-1 text-rose-400 font-semibold';
                isUsernameChecked = false;
                validateForm();
                return;
            }

            try {
                const { data, error } = await _supabase
                    .from('profiles')
                    .select('username')
                    .eq('username', username)
                    .maybeSingle();

                if (error) throw error;

                if (data) {
                    msgEl.textContent = '이미 사용 중인 아이디입니다.';
                    msgEl.className = 'text-[11px] mt-1 text-rose-400 font-semibold';
                    isUsernameChecked = false;
                } else {
                    msgEl.textContent = '사용 가능한 아이디입니다.';
                    msgEl.className = 'text-[11px] mt-1 text-emerald-400 font-semibold';
                    isUsernameChecked = true;
                }
            } catch (err) {
                console.error('ID Check Error:', err);
                alert('중복 확인 중 오류가 발생했습니다.');
                isUsernameChecked = false;
            }
            validateForm();
        }

        document.getElementById('username').addEventListener('input', () => {
            isUsernameChecked = false;
            const msgEl = document.getElementById('id-check-msg');
            msgEl.textContent = '아이디 중복확인을 다시 진행해 주세요.';
            msgEl.className = 'text-[11px] mt-1 text-slate-500';
            validateForm();
        });

        function execDaumPostcode() {
            new daum.Postcode({
                oncomplete: function(data) {
                    let addr = data.userSelectedType === 'R' ? data.roadAddress : data.jibunAddress;
                    document.getElementById('postcode').value = data.zonecode;
                    document.getElementById('address').value = addr;
                    document.getElementById('detailAddress').focus();
                    validateForm();
                }
            }).open();
        }

        // 필수 항목 작성 및 아이디 중복확인 완료 여부 검사
        function validateForm() {
            const name = document.getElementById('name').value.trim();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const phone = document.getElementById('phone').value.trim();
            const postcode = document.getElementById('postcode').value.trim();
            const detailAddress = document.getElementById('detailAddress').value.trim();
            
            const submitBtn = document.getElementById('submitBtn');
            const pwMatchMsg = document.getElementById('pw-match-msg');

            // 비밀번호 일치 실시간 안내 메시지
            if (confirmPassword.length > 0) {
                if (password === confirmPassword) {
                    pwMatchMsg.textContent = '비밀번호가 일치합니다.';
                    pwMatchMsg.className = 'text-[11px] mt-1 text-emerald-400 font-semibold';
                } else {
                    pwMatchMsg.textContent = '비밀번호가 일치하지 않습니다.';
                    pwMatchMsg.className = 'text-[11px] mt-1 text-rose-400 font-semibold';
                }
            } else {
                pwMatchMsg.textContent = '';
            }

            const isAllFilled = name && username && password && confirmPassword && phone && postcode && detailAddress;
            const isPasswordValid = password.length >= 6 && (password === confirmPassword);

            if (isAllFilled && isPasswordValid && isUsernameChecked) {
                submitBtn.disabled = false;
                submitBtn.className = "w-full bg-amber-400 text-slate-950 font-bold py-3.5 rounded-lg text-sm hover:bg-amber-300 transition shadow-lg mt-4 cursor-pointer";
                submitBtn.innerText = "가입 완료하기";
            } else {
                submitBtn.disabled = true;
                submitBtn.className = "w-full bg-slate-700 text-slate-400 font-bold py-3.5 rounded-lg text-sm transition shadow-lg mt-4 cursor-not-allowed";
                
                if (!isUsernameChecked) {
                    submitBtn.innerText = "아이디 중복확인을 진행해 주세요";
                } else if (!isAllFilled) {
                    submitBtn.innerText = "모든 필수 항목을 입력해 주세요";
                } else if (password.length < 6) {
                    submitBtn.innerText = "비밀번호는 6자 이상이어야 합니다";
                } else if (password !== confirmPassword) {
                    submitBtn.innerText = "비밀번호가 일치하지 않습니다";
                }
            }
        }

        ['name', 'password', 'confirmPassword', 'detailAddress'].forEach(id => {
            document.getElementById(id).addEventListener('input', validateForm);
        });

        // 회원가입 최종 완료 버튼 클릭 시 profiles 테이블에 직접 INSERT 및 상세 에러 로깅
        async function handleSignUp(e) {
            e.preventDefault();

            const nameInput = document.getElementById('name').value.trim();
            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value;
            const phoneInput = document.getElementById('phone').value.trim();
            const postcode = document.getElementById('postcode').value.trim();
            const address = document.getElementById('address').value.trim();
            const detailAddress = document.getElementById('detailAddress').value.trim();

            const fullAddress = `[${postcode}] ${address} ${detailAddress}`;
            const submitBtn = document.getElementById('submitBtn');

            submitBtn.disabled = true;
            submitBtn.textContent = '가입 처리 중...';

            try {
                console.log("데이터 저장 시도 중...", { username: usernameInput, name: nameInput, phone: phoneInput, address: fullAddress });

                const { data, error } = await _supabase
                    .from('profiles')
                    .insert([
                        {
                            username: usernameInput,
                            name: nameInput,
                            password: passwordInput,
                            phone: phoneInput,
                            address: fullAddress
                        }
                    ]);

                if (error) {
                    console.error('Supabase INSERT 에러 발생:', error);
                    alert('회원가입 처리 실패: ' + error.message);
                    submitBtn.disabled = false;
                    submitBtn.textContent = '가입 완료하기';
                    return;
                }

                alert('회원가입이 완료되었습니다! 로그인 페이지로 이동합니다.');
                window.location.href = 'login.html';
            } catch (err) {
                console.error('Unexpected Signup Error:', err);
                alert('회원가입 중 예상치 못한 오류가 발생했습니다.');
                submitBtn.disabled = false;
                submitBtn.textContent = '가입 완료하기';
            }
        }
    </script>
</body>
</html>
