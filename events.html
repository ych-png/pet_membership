<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belluna Pet - 이벤트</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-20">

    <!-- 통합 공통 헤더가 삽입될 위치 -->
    <div id="common-header"></div>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
            <h1 class="text-2xl font-bold text-slate-900 mb-6">🎁 이벤트</h1>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-center text-sm font-bold">
                <div class="p-6 border border-slate-200 rounded-xl hover:bg-amber-500/10 hover:border-amber-400 transition cursor-pointer">
                    <div class="text-2xl mb-2">🗓️</div>
                    <div>출석체크</div>
                </div>
                <div class="p-6 border border-slate-200 rounded-xl hover:bg-amber-500/10 hover:border-amber-400 transition cursor-pointer">
                    <div class="text-2xl mb-2">🤝</div>
                    <div>친구추천</div>
                </div>
                <div class="p-6 border border-slate-200 rounded-xl hover:bg-amber-500/10 hover:border-amber-400 transition cursor-pointer">
                    <div class="text-2xl mb-2">🎟️</div>
                    <div>쿠폰</div>
                </div>
                <div class="p-6 border border-slate-200 rounded-xl hover:bg-amber-500/10 hover:border-amber-400 transition cursor-pointer">
                    <div class="text-2xl mb-2">🎁</div>
                    <div>사은품</div>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-950 text-slate-400 text-xs py-8 border-t border-slate-800 mt-12">
        <div class="max-w-7xl mx-auto px-4 space-y-3">
            <div class="flex items-center space-x-2">
                <img src="beluna_logo.png" alt="Belluna Pet Logo" class="h-6 w-auto opacity-80">
                <span class="text-slate-200 font-bold">Belluna Pet (벨루나펫 Alpha Version)</span>
            </div>
            <p class="leading-relaxed">Belluna Pet은 한국애견연맹과 협력하여 반려인에게 저렴한 쇼핑과 다양한 혜택을 제공하는 플랫폼입니다.</p>
            <p class="text-slate-600 pt-2">© Belluna Pet. All rights reserved.</p>
        </div>
    </footer>

    <!-- 공통 헤더 스크립트 불러오기 -->
    <script src="header.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // 공통 헤더 렌더링 호출 ('events.html'을 전달하여 이벤트 메뉴 활성화)
            renderHeader('events.html');
        });
    </script>
</body>
</html>
