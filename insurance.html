<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belluna Pet - 삼성화재 펫보험</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 pb-20">
    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-2.5 flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-2">
                <img src="beluna_logo.png" alt="Belluna Pet Logo" class="h-9 w-auto object-contain">
                <span class="text-xl font-black text-amber-400 tracking-wider hidden sm:inline-block">Belluna Pet</span>
            </a>
            <a href="my.html" class="text-sm font-medium text-slate-200 hover:text-amber-400"><i class="fa-solid fa-user mr-1"></i> MY</a>
        </div>
        <nav class="bg-slate-950 text-slate-300 border-t border-slate-800/80 overflow-x-auto">
            <div class="max-w-7xl mx-auto px-4 flex whitespace-nowrap space-x-6 text-sm font-semibold">
                <a href="index.html" class="py-3 hover:text-amber-300 transition">🛒 공동구매</a>
                <a href="shopping.html" class="py-3 hover:text-amber-300 transition">🛍️ 쇼핑몰</a>
                <a href="hanacard.html" class="py-3 hover:text-amber-300 transition">💳 하나카드</a>
                <a href="insurance.html" class="py-3 border-b-2 border-amber-400 text-amber-400">🛡️ 펫보험</a>
                <a href="membership.html" class="py-3 hover:text-amber-300 transition">⭐ 멤버쉽혜택</a>
                <a href="events.html" class="py-3 hover:text-amber-300 transition">🎁 이벤트</a>
                <a href="my.html" class="py-3 hover:text-amber-300 transition">👤 MY</a>
            </div>
        </nav>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
            <!-- 메인 슬로건 및 안내 -->
            <div class="bg-slate-900 border border-slate-800 text-slate-100 rounded-xl p-6 mb-8">
                <h1 class="text-xl md:text-2xl font-extrabold text-amber-400 mb-3">
                    "믿을 수 있는 삼성보험으로, 우리 아이의 건강을 준비하세요."
                </h1>
                <p class="text-xs md:text-sm text-slate-300 leading-relaxed">
                    예상치 못한 질병이나 사고는 누구에게나 발생할 수 있습니다. Belluna Pet에서는 삼성화재 펫보험 정보를 통해 반려동물 의료비 부담을 줄일 수 있는 방법을 안내해 드립니다.
                </p>
            </div>

            <!-- 서브 메뉴 -->
            <div class="grid grid-cols-2 md:grid-cols-5 gap-3 text-center text-xs font-bold">
                <button class="p-4 border border-slate-200 rounded-xl hover:border-amber-400 hover:text-amber-600">펫보험이 필요한 이유</button>
                <button class="p-4 border border-slate-200 rounded-xl hover:border-amber-400 hover:text-amber-600">삼성화재 펫보험 소개</button>
                <button class="p-4 border border-slate-200 rounded-xl hover:border-amber-400 hover:text-amber-600">보장내용</button>
                <button class="p-4 border border-slate-200 rounded-xl hover:border-amber-400 hover:text-amber-600">보험료 계산</button>
                <button class="p-4 bg-amber-400 text-slate-950 font-bold rounded-xl hover:bg-amber-300">가입하기</button>
            </div>
        </section>
    </main>
</body>
</html>
