<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belluna Pet - 삼성화재 펫보험</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-20">

    <!-- 통합 공통 헤더가 삽입될 위치 -->
    <div id="common-header"></div>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
            <!-- 메인 슬로건 및 안내 -->
            <div class="bg-slate-900 border border-slate-800 text-slate-100 rounded-xl p-6 mb-8">
                <h1 class="text-xl md:text-2xl font-extrabold text-amber-400 mb-3">
                    "믿을 수 있는 삼성보험으로, 우리 아이의 건강을 준비하세요."
                </h1>
                <p class="text-xs md:text-sm text-slate-300 leading-relaxed">
                    예상치 못한 질병이나 사고는 누구에게나 발생할 수 있습니다. Belluna Pet에서는 삼성화재 펫보험 정보를 통해 반려동물 의료비 부담을 줄일 수 있는 방법을 안내해 드립니다.
                </p>
            </div>

            <!-- 서브 메뉴 -->
            <div class="grid grid-cols-2 md:grid-cols-5 gap-3 text-center text-xs font-bold">
                <button class="p-4 border border-slate-200 rounded-xl hover:border-amber-400 hover:text-amber-600">펫보험이 필요한 이유</button>
                <button class="p-4 border border-slate-200 rounded-xl hover:border-amber-400 hover:text-amber-600">삼성화재 펫보험 소개</button>
                <button class="p-4 border border-slate-200 rounded-xl hover:border-amber-400 hover:text-amber-600">보장내용</button>
                <button class="p-4 border border-slate-200 rounded-xl hover:border-amber-400 hover:text-amber-600">보험료 계산</button>
                <button class="p-4 bg-amber-400 text-slate-950 font-bold rounded-xl hover:bg-amber-300">가입하기</button>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-950 text-slate-400 text-xs py-8 border-t border-slate-800 mt-12">
        <div class="max-w-7xl mx-auto px-4 space-y-3">
            <div class="flex items-center space-x-2">
                <img src="beluna_logo.png" alt="Belluna Pet Logo" class="h-6 w-auto opacity-80">
                <span class="text-slate-200 font-bold">Belluna Pet (벨루나펫 Alpha Version)</span>
            </div>
            <p class="leading-relaxed">Belluna Pet은 한국애견연맹과 협력하여 반려인에게 저렴한 쇼핑과 다양한 혜택을 제공하는 플랫폼입니다.</p>
            <p class="text-slate-600 pt-2">© Belluna Pet. All rights reserved.</p>
        </div>
    </footer>

    <!-- 공통 헤더 스크립트 불러오기 -->
    <script src="header.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // 공통 헤더 렌더링 호출 ('insurance.html'을 전달하여 펫보험 메뉴 활성화)
            renderHeader('insurance.html');
        });
    </script>
</body>
</html>
