<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belluna Pet - MY 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Daum(Kakao) 우편번호 서비스 공식 스크립트 -->
    <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>

    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-20">

    <!-- 통합 공통 헤더가 삽입될 위치 -->
    <div id="common-header"></div>

    <main class="max-w-7xl mx-auto px-4 py-8 space-y-8">
        <!-- MY 대시보드 메인 -->
        <section class="bg-white rounded-2xl shadow-lg border border-slate-200 overflow-hidden">
            <!-- 상단 요약 카드 -->
            <div class="bg-slate-900 text-white p-6 border-b border-slate-800">
                <div class="flex flex-wrap justify-between items-center gap-2 mb-4">
                    <!-- 사용자 이름 표기 및 회원정보 확인 버튼 -->
                    <div class="flex items-center space-x-3">
                        <h1 class="text-xl font-bold flex items-center">
                            <i class="fa-solid fa-circle-user mr-2 text-amber-400"></i>
                            <span id="user-name">불러오는 중...</span> 님
                        </h1>
                        <button onclick="openInfoModal()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 px-2.5 py-1 rounded-lg transition flex items-center">
                            <i class="fa-solid fa-user-gear mr-1"></i> 회원정보 확인
                        </button>
                    </div>

                    <span id="user-grade" class="text-xs bg-amber-500/20 text-amber-300 border border-amber-500/40 px-3 py-1 rounded-full">
                        애견연맹 하나카드 회원
                    </span>
                </div>

                <!-- 이번달 절약금액 표기 -->
                <div class="bg-slate-800/80 rounded-xl p-5 border border-slate-700">
                    <p class="text-xs text-slate-400 font-medium mb-1">이번달 절약금액</p>
                    
                    <div id="total-saved" class="text-3xl font-black text-amber-400 mb-4">0 원</div>
                    
                    <div class="grid grid-cols-3 gap-2 text-center text-xs border-t border-slate-700/80 pt-3">
                        <div>
                            <span class="block text-slate-400 mb-0.5">회원가 절약</span>
                            <span id="member-saved" class="font-bold text-sm text-slate-200">0원</span>
                        </div>
                        <div class="border-x border-slate-700/80">
                            <span class="block text-slate-400 mb-0.5">공동구매 절약</span>
                            <span id="group-saved" class="font-bold text-sm text-slate-200">0원</span>
                        </div>
                        <div>
                            <span class="block text-slate-400 mb-0.5">하나카드 혜택</span>
                            <span id="card-saved" class="font-bold text-sm text-amber-400">0원</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- MY 퀵메뉴 6종 -->
            <div class="p-6 grid grid-cols-2 md:grid-cols-3 gap-4 text-center">
                <a href="/orders.html" class="p-4 rounded-xl bg-slate-50 hover:bg-amber-500/10 transition border border-slate-100 flex flex-col items-center">
                    <i class="fa-solid fa-box-open text-slate-900 text-2xl mb-2"></i>
                    <span class="text-xs font-bold text-slate-700">내 주문</span>
                </a>
                <a href="/coupons.html" class="p-4 rounded-xl bg-slate-50 hover:bg-amber-500/10 transition border border-slate-100 flex flex-col items-center">
                    <i class="fa-solid fa-ticket text-slate-900 text-2xl mb-2"></i>
                    <span class="text-xs font-bold text-slate-700">내 쿠폰</span>
                </a>
                <a href="/mileage.html" class="p-4 rounded-xl bg-slate-50 hover:bg-amber-500/10 transition border border-slate-100 flex flex-col items-center">
                    <i class="fa-solid fa-coins text-slate-900 text-2xl mb-2"></i>
                    <span class="text-xs font-bold text-slate-700">내 마일리지</span>
                </a>
                <a href="/savings.html" class="p-4 rounded-xl bg-slate-50 hover:bg-amber-500/10 transition border border-slate-100 flex flex-col items-center">
                    <i class="fa-solid fa-piggy-bank text-slate-900 text-2xl mb-2"></i>
                    <span class="text-xs font-bold text-slate-700">내 절약금액</span>
                </a>
                <a href="/group-buy.html" class="p-4 rounded-xl bg-slate-50 hover:bg-amber-500/10 transition border border-slate-100 flex flex-col items-center">
                    <i class="fa-solid fa-users text-slate-900 text-2xl mb-2"></i>
                    <span class="text-xs font-bold text-slate-700">내 공동구매</span>
                </a>
                <a href="/delivery.html" class="p-4 rounded-xl bg-slate-50 hover:bg-amber-500/10 transition border border-slate-100 flex flex-col items-center">
                    <i class="fa-solid fa-truck-fast text-slate-900 text-2xl mb-2"></i>
                    <span class="text-xs font-bold text-slate-700">내 배송조회</span>
                </a>
            </div>
        </section>
    </main>

    <!-- 회원정보 확인 및 수정 모달 팝업 -->
    <div id="infoModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6 shadow-2xl text-slate-100 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-slate-800 pb-4 mb-4">
                <h3 id="modalTitle" class="text-lg font-bold text-amber-400">회원정보 확인</h3>
                <button onclick="closeInfoModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <!-- 1. 정보 확인 뷰 (Read-only) -->
            <div id="infoViewMode" class="space-y-4 text-sm">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">아이디</label>
                    <div id="view-username" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2.5 text-slate-200">-</div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">이름</label>
                    <div id="view-name" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2.5 text-slate-200">-</div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">전화번호</label>
                    <div id="view-phone" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2.5 text-slate-200">-</div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">주소</label>
                    <div id="view-address" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2.5 text-slate-200 min-h-[42px]">-</div>
                </div>

                <div class="pt-4">
                    <button type="button" onclick="switchToEditMode()" class="w-full bg-amber-400 hover:bg-amber-300 text-slate-950 py-3 rounded-lg text-xs font-bold transition shadow-md">
                        회원정보 수정하기
                    </button>
                </div>
            </div>

            <!-- 2. 정보 수정 뷰 (Editable Form) -->
            <form id="infoEditMode" onsubmit="handleUpdateProfile(event)" class="space-y-3 hidden">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">아이디 (수정 불가)</label>
                    <input type="text" id="edit-username" disabled class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-500 cursor-not-allowed">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">이름</label>
                    <input type="text" id="edit-name" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-400">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">전화번호</label>
                    <input type="tel" id="edit-phone" required maxlength="13" oninput="formatPhoneNumber(this)" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-400">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">주소</label>
                    <div class="flex gap-2 mb-1.5">
                        <input type="text" id="edit-postcode" readonly placeholder="우편번호" class="w-28 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-300">
                        <button type="button" onclick="execDaumPostcode()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-semibold px-3 rounded-lg transition whitespace-nowrap">
                            우편번호 검색
                        </button>
                    </div>
                    <input type="text" id="edit-address" readonly placeholder="기본 주소" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-300 mb-1.5">
                    <input type="text" id="edit-detailAddress" placeholder="상세 주소 입력" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-400">
                </div>
                <div class="border-t border-slate-800 pt-2 mt-2">
                    <label class="block text-xs font-semibold text-slate-300 mb-1">새 비밀번호 (변경 시에만 입력)</label>
                    <input type="password" id="edit-password" placeholder="6자 이상 입력" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-400">
                </div>

                <div class="flex space-x-2 pt-3">
                    <button type="button" onclick="switchToViewMode()" class="w-1/2 bg-slate-800 hover:bg-slate-700 text-slate-300 py-2.5 rounded-lg text-xs font-bold transition">취소</button>
                    <button type="submit" id="updateBtn" class="w-1/2 bg-amber-400 hover:bg-amber-300 text-slate-950 py-2.5 rounded-lg text-xs font-bold transition">저장하기</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-slate-950 text-slate-400 text-xs py-8 border-t border-slate-800 mt-12">
        <div class="max-w-7xl mx-auto px-4 space-y-3">
            <div class="flex items-center space-x-2">
                <img src="beluna_logo.png" alt="Belluna Pet Logo" class="h-6 w-auto opacity-80">
                <span class="text-slate-200 font-bold">Belluna Pet (벨루나펫 Alpha Version)</span>
            </div>
            <p class="leading-relaxed">Belluna Pet은 한국애견연맹과 협력하여 반려인에게 저렴한 쇼핑과 다양한 혜택을 제공하는 플랫폼입니다.</p>
            <p class="text-slate-600 pt-2">© Belluna Pet. All rights reserved.</p>
        </div>
    </footer>

    <!-- 공통 헤더 스크립트 불러오기 -->
    <script src="header.js"></script>

    <script>
        const SUPABASE_URL = 'https://qemfpmnsywfzuyzozkqj.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_m6B4hq2B-txvZ09ha5bLrQ_CG7HcnhS';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUserProfile = {
            username: '',
            name: '',
            phone: '',
            address: ''
        };

        function formatPhoneNumber(input) {
            let value = typeof input === 'string' ? input : input.value;
            value = value.replace(/[^0-9]/g, '');
            if (value.length > 11) value = value.substring(0, 11);

            let formatted = value;
            if (value.length < 4) formatted = value;
            else if (value.length < 7) formatted = `${value.substring(0, 3)}-${value.substring(3)}`;
            else if (value.length < 11) formatted = `${value.substring(0, 3)}-${value.substring(3, 6)}-${value.substring(6)}`;
            else formatted = `${value.substring(0, 3)}-${value.substring(3, 7)}-${value.substring(7)}`;

            if (typeof input === 'object' && input.value !== undefined) {
                input.value = formatted;
            }
            return formatted;
        }

        function formatCurrency(amount) {
            return Number(amount || 0).toLocaleString('ko-KR');
        }

        // 사용자 데이터 및 profiles 테이블 정보 로드
        async function loadUserDashboardData() {
            try {
                const isLoggedIn = localStorage.getItem('isLoggedIn');
                const username = localStorage.getItem('userUsername');

                if (isLoggedIn !== 'true' || !username) {
                    alert("로그인 세션이 만료되었거나 비로그인 상태입니다. 로그인 페이지로 이동합니다.");
                    window.location.href = "login.html";
                    return;
                }

                // Supabase profiles 테이블에서 최신 정보 조회
                const { data: profileData, error } = await _supabase
                    .from('profiles')
                    .select('*')
                    .eq('username', username)
                    .maybeSingle();

                if (error || !profileData) {
                    console.error("프로필 조회 실패:", error);
                    alert("회원 정보를 불러오지 못했습니다. 다시 로그인해 주세요.");
                    window.location.href = "login.html";
                    return;
                }

                currentUserProfile.username = profileData.username;
                currentUserProfile.name = profileData.name || localStorage.getItem('userName') || "회원";
                currentUserProfile.phone = profileData.phone || localStorage.getItem('userPhone') || "-";
                currentUserProfile.address = profileData.address || "-";

                // 로컬 스토리지 동기화
                localStorage.setItem('userName', currentUserProfile.name);
                if (currentUserProfile.phone !== "-") localStorage.setItem('userPhone', currentUserProfile.phone);

                const mockSavings = { member: 12300, group: 18500, card: 8700 };
                const totalSavedAmount = mockSavings.member + mockSavings.group + mockSavings.card;

                document.getElementById('user-name').textContent = currentUserProfile.name;
                document.getElementById('user-grade').textContent = "애견연맹 하나카드 회원";
                document.getElementById('total-saved').textContent = `${formatCurrency(totalSavedAmount)} 원`;
                document.getElementById('member-saved').textContent = `${formatCurrency(mockSavings.member)}원`;
                document.getElementById('group-saved').textContent = `${formatCurrency(mockSavings.group)}원`;
                document.getElementById('card-saved').textContent = `${formatCurrency(mockSavings.card)}원`;

            } catch (error) {
                console.error("대시보드 데이터 로드 실패:", error);
            }
        }

        // 회원정보 확인 모달 열기 (기본 View 모드)
        async function openInfoModal() {
            await loadUserDashboardData(); // 최신 정보 갱신

            document.getElementById('view-username').textContent = currentUserProfile.username;
            document.getElementById('view-name').textContent = currentUserProfile.name;
            document.getElementById('view-phone').textContent = currentUserProfile.phone;
            document.getElementById('view-address').textContent = currentUserProfile.address;

            switchToViewMode();
            document.getElementById('infoModal').classList.remove('hidden');
        }

        // 모달 닫기
        function closeInfoModal() {
            document.getElementById('infoModal').classList.add('hidden');
            switchToViewMode();
        }

        // 확인 뷰로 전환
        function switchToViewMode() {
            document.getElementById('modalTitle').textContent = '회원정보 확인';
            document.getElementById('infoViewMode').classList.remove('hidden');
            document.getElementById('infoEditMode').classList.add('hidden');
        }

        // 수정 뷰로 전환
        function switchToEditMode() {
            document.getElementById('modalTitle').textContent = '회원정보 수정';
            document.getElementById('infoViewMode').classList.add('hidden');
            document.getElementById('infoEditMode').classList.remove('hidden');

            document.getElementById('edit-username').value = currentUserProfile.username;
            document.getElementById('edit-name').value = currentUserProfile.name !== '회원' ? currentUserProfile.name : '';
            document.getElementById('edit-phone').value = currentUserProfile.phone !== '-' ? currentUserProfile.phone : '';

            // 주소 파싱 ([우편번호] 기본주소 상세주소 형태 분해 시도)
            const addrFull = currentUserProfile.address;
            const postcodeMatch = addrFull.match(/\[(.*?)\]/);
            if (postcodeMatch) {
                document.getElementById('edit-postcode').value = postcodeMatch[1];
                let remain = addrFull.replace(`[${postcodeMatch[1]}]`, '').trim();
                document.getElementById('edit-address').value = remain;
                document.getElementById('edit-detailAddress').value = '';
            } else {
                document.getElementById('edit-address').value = addrFull !== '-' ? addrFull : '';
                document.getElementById('edit-detailAddress').value = '';
            }
            document.getElementById('edit-password').value = '';
        }

        // 카카오 우편번호 검색 팝업 호출
        function execDaumPostcode() {
            new daum.Postcode({
                oncomplete: function(data) {
                    let addr = data.userSelectedType === 'R' ? data.roadAddress : data.jibunAddress;
                    document.getElementById('edit-postcode').value = data.zonecode;
                    document.getElementById('edit-address').value = addr;
                    document.getElementById('edit-detailAddress').focus();
                }
            }).open();
        }

        // 회원정보 수정 제출 처리
        async function handleUpdateProfile(e) {
            e.preventDefault();

            const newName = document.getElementById('edit-name').value.trim();
            const newPhone = document.getElementById('edit-phone').value.trim();
            const postcode = document.getElementById('edit-postcode').value.trim();
            const address = document.getElementById('edit-address').value.trim();
            const detailAddress = document.getElementById('edit-detailAddress').value.trim();
            const newPassword = document.getElementById('edit-password').value;
            const updateBtn = document.getElementById('updateBtn');

            const fullAddress = postcode && address ? `[${postcode}] ${address} ${detailAddress}` : address;

            updateBtn.disabled = true;
            updateBtn.innerText = '수정 중...';

            try {
                const username = localStorage.getItem('userUsername');
                if (!username) {
                    alert('세션이 만료되었습니다. 다시 로그인해 주세요.');
                    window.location.href = 'login.html';
                    return;
                }

                // 업데이트할 객체 구성
                let updateData = {
                    name: newName,
                    phone: newPhone,
                    address: fullAddress
                };

                if (newPassword) {
                    if (newPassword.length < 6) {
                        alert('새 비밀번호는 최소 6자 이상이어야 합니다.');
                        updateBtn.disabled = false;
                        updateBtn.innerText = '저장하기';
                        return;
                    }
                    updateData.password = newPassword;
                }

                // profiles 테이블 업데이트
                const { error: profileError } = await _supabase
                    .from('profiles')
                    .update(updateData)
                    .eq('username', username);

                if (profileError) {
                    throw profileError;
                }

                alert('회원정보가 성공적으로 수정되었습니다.');
                localStorage.setItem('userName', newName);
                localStorage.setItem('userPhone', newPhone);

                closeInfoModal();
                await loadUserDashboardData();

            } catch (err) {
                console.error('Update Profile Error:', err);
                alert('수정 처리 중 오류가 발생했습니다: ' + (err.message || ''));
            } finally {
                updateBtn.disabled = false;
                updateBtn.innerText = '저장하기';
            }
        }

        document.addEventListener("DOMContentLoaded", function() {
            if (typeof renderHeader === 'function') {
                renderHeader('my.html');
            }
            loadUserDashboardData();
        });
    </script>
</body>
</html>
