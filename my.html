<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belluna Pet - MY 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-20">

    <!-- 통합 공통 헤더가 삽입될 위치 -->
    <div id="common-header"></div>

    <main class="max-w-7xl mx-auto px-4 py-8 space-y-8">
        <!-- MY 대시보드 메인 -->
        <section class="bg-white rounded-2xl shadow-lg border border-slate-200 overflow-hidden">
            <!-- 상단 요약 카드 -->
            <div class="bg-slate-900 text-white p-6 border-b border-slate-800">
                <div class="flex justify-between items-center mb-4">
                    <h1 class="text-xl font-bold flex items-center"><i class="fa-solid fa-circle-user mr-2 text-amber-400"></i> 홍길동 님</h1>
                    <span class="text-xs bg-amber-500/20 text-amber-300 border border-amber-500/40 px-3 py-1 rounded-full">애견연맹 하나카드 회원</span>
                </div>

                <!-- 이번달 절약금액 표기 (최상단) -->
                <div class="bg-slate-800/80 rounded-xl p-5 border border-slate-700">
                    <p class="text-xs text-slate-400 font-medium mb-1">이번달 절약금액</p>
                    <div class="text-3xl font-black text-amber-400 mb-4">39,500 원</div>
                    <div class="grid grid-cols-3 gap-2 text-center text-xs border-t border-slate-700/80 pt-3">
                        <div>
                            <span class="block text-slate-400 mb-0.5">회원가 절약</span>
                            <span class="font-bold text-sm text-slate-200">12,300원</span>
                        </div>
                        <div class="border-x border-slate-700/80">
                            <span class="block text-slate-400 mb-0.5">공동구매 절약</span>
                            <span class="font-bold text-sm text-slate-200">18,500원</span>
                        </div>
                        <div>
                            <span class="block text-slate-400 mb-0.5">하나카드 혜택</span>
                            <span class="font-bold text-sm text-amber-400">8,700원</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- MY 퀵메뉴 6종 -->
            <div class="p-6 grid grid-cols-2 md:grid-cols-3 gap-4 text-center">
                <a href="#" class="p-4 rounded-xl bg-slate-50 hover:bg-amber-500/10 transition border border-slate-100 flex flex-col items-center">
                    <i class="fa-solid fa-box-open text-slate-900 text-2xl mb-2"></i>
                    <span class="text-xs font-bold text-slate-700">내 주문</span>
                </a>
                <a href="#" class="p-4 rounded-xl bg-slate-50 hover:bg-amber-500/10 transition border border-slate-100 flex flex-col items-center">
                    <i class="fa-solid fa-ticket text-slate-900 text-2xl mb-2"></i>
                    <span class="text-xs font-bold text-slate-700">내 쿠폰</span>
                </a>
                <a href="#" class="p-4 rounded-xl bg-slate-50 hover:bg-amber-500/10 transition border border-slate-100 flex flex-col items-center">
                    <i class="fa-solid fa-coins text-slate-900 text-2xl mb-2"></i>
                    <span class="text-xs font-bold text-slate-700">내 마일리지</span>
                </a>
                <a href="#" class="p-4 rounded-xl bg-slate-50 hover:bg-amber-500/10 transition border border-slate-100 flex flex-col items-center">
                    <i class="fa-solid fa-piggy-bank text-slate-900 text-2xl mb-2"></i>
                    <span class="text-xs font-bold text-slate-700">내 절약금액</span>
                </a>
                <a href="#" class="p-4 rounded-xl bg-slate-50 hover:bg-amber-500/10 transition border border-slate-100 flex flex-col items-center">
                    <i class="fa-solid fa-users text-slate-900 text-2xl mb-2"></i>
                    <span class="text-xs font-bold text-slate-700">내 공동구매</span>
                </a>
                <a href="#" class="p-4 rounded-xl bg-slate-50 hover:bg-amber-500/10 transition border border-slate-100 flex flex-col items-center">
                    <i class="fa-solid fa-truck-fast text-slate-900 text-2xl mb-2"></i>
                    <span class="text-xs font-bold text-slate-700">내 배송조회</span>
                </a>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-950 text-slate-400 text-xs py-8 border-t border-slate-800 mt-12">
        <div class="max-w-7xl mx-auto px-4 space-y-3">
            <div class="flex items-center space-x-2">
                <img src="beluna_logo.png" alt="Belluna Pet Logo" class="h-6 w-auto opacity-80">
                <span class="text-slate-200 font-bold">Belluna Pet (벨루나펫 Alpha Version)</span>
            </div>
            <p class="leading-relaxed">Belluna Pet은 한국애견연맹과 협력하여 반려인에게 저렴한 쇼핑과 다양한 혜택을 제공하는 플랫폼입니다.</p>
            <p class="text-slate-600 pt-2">© Belluna Pet. All rights reserved.</p>
        </div>
    </footer>

    <!-- 공통 헤더 스크립트 불러오기 -->
    <script src="header.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // 공통 헤더 렌더링 호출 ('my.html'을 전달하여 MY 메뉴 활성화)
            renderHeader('my.html');
        });
    </script>
</body>
</html>
