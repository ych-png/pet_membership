<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belluna Pet - 애견연맹 하나카드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-20">

    <!-- 통합 공통 헤더가 삽입될 위치 -->
    <div id="common-header"></div>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
            <div class="border-b border-slate-100 pb-4 mb-6">
                <h1 class="text-2xl font-bold text-slate-900">💳 애견연맹 하나카드</h1>
                <p class="text-sm text-slate-600 mt-2">애견연맹 하나카드로 결제하면 더 많은 할인과 적립을 받을 수 있습니다.</p>
            </div>

            <!-- 서브 메뉴 -->
            <div class="grid grid-cols-2 md:grid-cols-5 gap-3 text-center text-xs font-bold mb-8">
                <button class="p-4 bg-slate-900 border border-slate-800 text-amber-400 rounded-xl">카드 소개</button>
                <button class="p-4 bg-slate-50 border border-slate-200 rounded-xl hover:bg-slate-100">카드 신청</button>
                <button class="p-4 bg-slate-50 border border-slate-200 rounded-xl hover:bg-slate-100">카드 혜택</button>
                <button class="p-4 bg-slate-50 border border-slate-200 rounded-xl hover:bg-slate-100">회원 혜택 비교</button>
                <button class="p-4 bg-slate-50 border border-slate-200 rounded-xl hover:bg-slate-100">이벤트</button>
            </div>

            <div class="bg-amber-500/10 border border-amber-500/30 rounded-xl p-6 text-center text-sm text-amber-900">
                <i class="fa-solid fa-circle-info text-xl mb-2 block text-amber-600"></i>
                현재 하나카드와 세부 제휴 협의 진행 중에 있습니다. 빠른 시일 내 서비스가 오픈될 예정입니다.
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-950 text-slate-400 text-xs py-8 border-t border-slate-800 mt-12">
        <div class="max-w-7xl mx-auto px-4 space-y-3">
            <div class="flex items-center space-x-2">
                <img src="beluna_logo.png" alt="Belluna Pet Logo" class="h-6 w-auto opacity-80">
                <span class="text-slate-200 font-bold">Belluna Pet (벨루나펫 Alpha Version)</span>
            </div>
            <p class="leading-relaxed">Belluna Pet은 한국애견연맹과 협력하여 반려인에게 저렴한 쇼핑과 다양한 혜택을 제공하는 플랫폼입니다.</p>
            <p class="text-slate-600 pt-2">© Belluna Pet. All rights reserved.</p>
        </div>
    </footer>

    <!-- 공통 헤더 스크립트 불러오기 -->
    <script src="header.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // 공통 헤더 렌더링 호출 ('hanacard.html'을 전달하여 하나카드 메뉴 활성화)
            renderHeader('hanacard.html');
        });
    </script>
</body>
</html>
