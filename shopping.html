<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belluna Pet - 쇼핑몰</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-20">

    <!-- 통합 공통 헤더가 삽입될 위치 -->
    <div id="common-header"></div>

    <main class="max-w-7xl mx-auto px-4 py-8 space-y-8">
        <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 space-y-6">
            <div class="border-b border-slate-100 pb-4">
                <h1 class="text-2xl font-bold text-slate-900">🛍️ 벨루나 쇼핑몰</h1>
                <p class="text-xs text-slate-500 mt-1">친누 쇼핑몰 연동 관리 & 결제 시스템 적용</p>
            </div>

            <!-- 카테고리 A (애견용품) -->
            <div>
                <h2 class="text-sm font-bold text-slate-900 bg-amber-400/20 border border-amber-400/30 px-3 py-1.5 rounded-md inline-block mb-3">A. 애견용품</h2>
                <div class="grid grid-cols-2 sm:grid-cols-6 gap-3 text-center text-xs font-semibold">
                    <a href="#" class="p-3 border rounded-lg transition category-btn-a bg-amber-500 text-white border-amber-500 shadow-xs" data-category="all">전체</a>
                    <a href="#" class="p-3 border border-slate-200 rounded-lg hover:border-amber-400 hover:text-amber-600 transition category-btn-a bg-white text-slate-700" data-category="feed">사료</a>
                    <a href="#" class="p-3 border border-slate-200 rounded-lg hover:border-amber-400 hover:text-amber-600 transition category-btn-a bg-white text-slate-700" data-category="treat">간식</a>
                    <a href="#" class="p-3 border border-slate-200 rounded-lg hover:border-amber-400 hover:text-amber-600 transition category-btn-a bg-white text-slate-700" data-category="supplement">영양제</a>
                    <a href="#" class="p-3 border border-slate-200 rounded-lg hover:border-amber-400 hover:text-amber-600 transition category-btn-a bg-white text-slate-700" data-category="health">건강관리</a>
                    <a href="#" class="p-3 border border-slate-200 rounded-lg hover:border-amber-400 hover:text-amber-600 transition category-btn-a bg-white text-slate-700" data-category="toy">장난감</a>
                    <a href="#" class="p-3 border border-slate-200 rounded-lg hover:border-amber-400 hover:text-amber-600 transition category-btn-a bg-white text-slate-700" data-category="walk">산책</a>
                    <a href="#" class="p-3 border border-slate-200 rounded-lg hover:border-amber-400 hover:text-amber-600 transition category-btn-a bg-white text-slate-700" data-category="grooming">미용</a>
                    <a href="#" class="p-3 border border-slate-200 rounded-lg hover:border-amber-400 hover:text-amber-600 transition category-btn-a bg-white text-slate-700" data-category="toilet">배변</a>
                    <a href="#" class="p-3 border border-slate-200 rounded-lg hover:border-amber-400 hover:text-amber-600 transition category-btn-a bg-white text-slate-700" data-category="house">하우스</a>
                    <a href="#" class="p-3 border border-slate-200 rounded-lg hover:border-amber-400 hover:text-amber-600 transition category-btn-a bg-white text-slate-700" data-category="carrier">이동장</a>
                </div>
            </div>

            <!-- 카테고리 B (반려인을 위한 생활용품) -->
            <div>
                <h2 class="text-sm font-bold text-slate-900 bg-slate-100 border border-slate-200 px-3 py-1.5 rounded-md inline-block mb-3">B. 반려인을 위한 생활용품</h2>
                <div class="grid grid-cols-2 sm:grid-cols-5 gap-3 text-center text-xs font-semibold">
                    <a href="#" class="p-3 border rounded-lg transition category-btn-b bg-slate-900 text-white border-slate-900 shadow-xs" data-category="all">전체</a>
                    <a href="#" class="p-3 border border-slate-200 rounded-lg hover:border-slate-800 hover:text-slate-900 transition category-btn-b bg-white text-slate-700" data-category="human-health">건강식품</a>
                    <a href="#" class="p-3 border border-slate-200 rounded-lg hover:border-slate-800 hover:text-slate-900 transition category-btn-b bg-white text-slate-700" data-category="living">생활용품</a>
                    <a href="#" class="p-3 border border-slate-200 rounded-lg hover:border-slate-800 hover:text-slate-900 transition category-btn-b bg-white text-slate-700" data-category="kitchen">주방</a>
                    <a href="#" class="p-3 border border-slate-200 rounded-lg hover:border-slate-800 hover:text-slate-900 transition category-btn-b bg-white text-slate-700" data-category="bath">욕실</a>
                    <a href="#" class="p-3 border border-slate-200 rounded-lg hover:border-slate-800 hover:text-slate-900 transition category-btn-b bg-white text-slate-700" data-category="car">자동차</a>
                    <a href="#" class="p-3 border border-slate-200 rounded-lg hover:border-slate-800 hover:text-slate-900 transition category-btn-b bg-white text-slate-700" data-category="camping">캠핑</a>
                    <a href="#" class="p-3 border border-slate-200 rounded-lg hover:border-slate-800 hover:text-slate-900 transition category-btn-b bg-white text-slate-700" data-category="travel">여행</a>
                    <a href="#" class="p-3 border border-slate-200 rounded-lg hover:border-slate-800 hover:text-slate-900 transition category-btn-b bg-white text-slate-700" data-category="appliance">가전</a>
                </div>
            </div>
        </section>

        <!-- 상품 목록 영역 -->
        <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 space-y-6">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 border-b border-slate-100 pb-4">
                <div>
                    <h2 class="text-lg font-bold text-slate-900">📦 상품 목록</h2>
                    <span id="product-count" class="text-xs text-slate-500 font-medium mt-1 block">총 0개 상품</span>
                </div>
                
                <!-- 상품 검색 입력창 -->
                <div class="relative w-full sm:w-72">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </span>
                    <input type="text" id="search-input" placeholder="상품 이름 또는 브랜드 검색..." class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-blue-500 focus:bg-white transition">
                </div>
            </div>

            <!-- 상품 카드 그리드 (모바일에서는 테두리를 없애고 컴팩트하게 배치) -->
            <div id="product-grid" class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4">
                <p class="col-span-full text-center text-slate-400 py-10 text-sm">상품을 불러오는 중입니다...</p>
            </div>

            <!-- 페이지네이션 번호 버튼 영역 -->
            <div id="pagination" class="flex justify-center items-center gap-2 pt-4 border-t border-slate-100"></div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-950 text-slate-400 text-xs py-8 border-t border-slate-800 mt-12">
        <div class="max-w-7xl mx-auto px-4 space-y-3">
            <div class="flex items-center space-x-2">
                <span class="text-slate-200 font-bold">Belluna Pet (벨루나펫 Alpha Version)</span>
            </div>
            <p class="leading-relaxed">Belluna Pet은 반려인에게 저렴한 쇼핑과 다양한 혜택을 제공하는 플랫폼입니다.</p>
            <p class="text-slate-600 pt-2">© Belluna Pet. All rights reserved.</p>
        </div>
    </footer>

    <!-- 공통 헤더 스크립트 불러오기 -->
    <script src="header.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            renderHeader('shopping.html');

            let allProducts = []; 
            let filteredProducts = []; 
            let currentPage = 1;
            const itemsPerPage = 20; 

            fetch('products.json')
                .then(response => response.json())
                .then(products => {
                    allProducts = products;
                    filteredProducts = products; 
                    updateDisplay();
                })
                .catch(error => {
                    console.error('상품 데이터를 불러오는 중 오류 발생:', error);
                    document.getElementById('product-grid').innerHTML = '<p class="col-span-full text-center text-red-500 py-10">상품 데이터를 불러오지 못했습니다. Live Server로 열려있는지 확인해 주세요.</p>';
                });

            function updateDisplay() {
                const grid = document.getElementById('product-grid');
                const pagination = document.getElementById('pagination');
                const countLabel = document.getElementById('product-count');
                
                grid.innerHTML = '';
                countLabel.innerText = `총 ${filteredProducts.length}개 상품`;

                if (filteredProducts.length === 0) {
                    grid.innerHTML = '<p class="col-span-full text-center text-slate-400 py-10">검색된 상품이 없습니다.</p>';
                    pagination.innerHTML = '';
                    return;
                }

                const totalPages = Math.ceil(filteredProducts.length / itemsPerPage);
                if (currentPage > totalPages) currentPage = 1;

                const startIndex = (currentPage - 1) * itemsPerPage;
                const endIndex = startIndex + itemsPerPage;
                const currentItems = filteredProducts.slice(startIndex, endIndex);

                currentItems.forEach((item) => {
                    const originalIndex = allProducts.indexOf(item);

                    const card = document.createElement('div');
                    // ★ 모바일에서는 테두리와 그림자를 없애고(border-0 shadow-none), PC(sm:)에서는 기존 카드 형태(border shadow-sm) 유지
                    card.className = "bg-white p-2 sm:p-4 border-0 sm:border sm:border-slate-200 rounded-none sm:rounded-xl shadow-none sm:shadow-sm hover:shadow-md transition flex flex-col justify-between";
                    
                    card.innerHTML = `
                        <a href="detail.html?id=${originalIndex}" class="block">
                            <!-- 이미지 비율을 모바일에 맞게 살짝 줄여서 세로 길이를 최적화 -->
                            <div class="w-full h-36 sm:h-48 bg-slate-100 rounded-lg overflow-hidden mb-2 sm:mb-3">
                                <img src="${item.image}" alt="${item.name}" class="w-full h-full object-cover hover:scale-105 transition duration-300" onerror="this.src='https://via.placeholder.com/300?text=No+Image';">
                            </div>
                            <span class="text-[10px] sm:text-xs text-blue-600 font-semibold">${item.brand}</span>
                            <h3 class="text-xs sm:text-sm font-bold text-slate-900 truncate mt-0.5 sm:mt-1">${item.name}</h3>
                        </a>
                        <div class="mt-2 sm:mt-3 pt-1.5 sm:pt-2 border-t border-slate-100 flex items-center justify-between">
                            <span class="text-xs sm:text-sm font-extrabold text-slate-900">${Number(item.price).toLocaleString()}원</span>
                            <a href="detail.html?id=${originalIndex}" class="px-2.5 sm:px-3 py-1 sm:py-1.5 bg-blue-600 text-white text-[10px] sm:text-xs font-semibold rounded-lg hover:bg-blue-700 transition">구매하기</a>
                        </div>
                    `;
                    grid.appendChild(card);
                });

                renderPagination(totalPages);
            }

            function renderPagination(totalPages) {
                const pagination = document.getElementById('pagination');
                pagination.innerHTML = '';

                if (totalPages <= 1) return;

                const prevBtn = document.createElement('button');
                prevBtn.innerHTML = '<i class="fa-solid fa-chevron-left"></i>';
                prevBtn.className = `px-3 py-1.5 rounded-lg border text-xs font-semibold transition ${currentPage === 1 ? 'bg-slate-100 text-slate-300 border-slate-200 cursor-not-allowed' : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-50'}`;
                prevBtn.disabled = currentPage === 1;
                prevBtn.addEventListener('click', () => {
                    if (currentPage > 1) {
                        currentPage--;
                        updateDisplay();
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    }
                });
                pagination.appendChild(prevBtn);

                let startPage = Math.max(1, currentPage - 2);
                let endPage = Math.min(totalPages, startPage + 4);
                if (endPage - startPage < 4) {
                    startPage = Math.max(1, endPage - 4);
                }

                for (let i = startPage; i <= endPage; i++) {
                    const pageBtn = document.createElement('button');
                    pageBtn.innerText = i;
                    pageBtn.className = `px-3.5 py-1.5 rounded-lg text-xs font-bold transition ${i === currentPage ? 'bg-blue-600 text-white shadow-xs' : 'bg-white text-slate-700 border border-slate-200 hover:bg-slate-50'}`;
                    pageBtn.addEventListener('click', () => {
                        currentPage = i;
                        updateDisplay();
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    });
                    pagination.appendChild(pageBtn);
                }

                const nextBtn = document.createElement('button');
                nextBtn.innerHTML = '<i class="fa-solid fa-chevron-right"></i>';
                nextBtn.className = `px-3 py-1.5 rounded-lg border text-xs font-semibold transition ${currentPage === totalPages ? 'bg-slate-100 text-slate-300 border-slate-200 cursor-not-allowed' : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-50'}`;
                nextBtn.disabled = currentPage === totalPages;
                nextBtn.addEventListener('click', () => {
                    if (currentPage < totalPages) {
                        currentPage++;
                        updateDisplay();
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    }
                });
                pagination.appendChild(nextBtn);
            }

            const searchInput = document.getElementById('search-input');
            searchInput.addEventListener('input', function(e) {
                const keyword = e.target.value.toLowerCase().trim();
                
                filteredProducts = allProducts.filter(item => {
                    const nameMatch = item.name && item.name.toLowerCase().includes(keyword);
                    const brandMatch = item.brand && item.brand.toLowerCase().includes(keyword);
                    return nameMatch || brandMatch;
                });

                currentPage = 1; 
                updateDisplay();
            });
        });
    </script>
</body>
</html>
