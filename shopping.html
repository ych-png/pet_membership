<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belluna Pet - 쇼핑몰</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-20">

    <!-- 통합 공통 헤더가 삽입될 위치 -->
    <div id="common-header"></div>

    <main class="max-w-7xl mx-auto px-4 py-8 space-y-8">
        <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
            <div class="mb-6 border-b border-slate-100 pb-4">
                <h1 class="text-2xl font-bold text-slate-900">🛍️ 벨루나 쇼핑몰</h1>
                <p class="text-xs text-slate-500 mt-1">친누 쇼핑몰 연동 관리 & 친누 결제 시스템 적용</p>
            </div>

            <!-- 카테고리 A -->
            <div class="mb-8">
                <h2 class="text-sm font-bold text-slate-900 bg-amber-400/20 border border-amber-400/30 px-3 py-1.5 rounded-md inline-block mb-3">A. 애견용품</h2>
                <div class="grid grid-cols-2 sm:grid-cols-5 gap-3 text-center text-xs font-semibold">
                    <a href="#" class="p-3 border border-slate-200 rounded-lg hover:border-amber-400 hover:text-amber-600 transition">사료</a>
                    <a href="#" class="p-3 border border-slate-200 rounded-lg hover:border-amber-400 hover:text-amber-600 transition">간식</a>
                    <a href="#" class="p-3 border border-slate-200 rounded-lg hover:border-amber-400 hover:text-amber-600 transition">영양제</a>
                    <a href="#" class="p-3 border border-slate-200 rounded-lg hover:border-amber-400 hover:text-amber-600 transition">건강관리</a>
                    <a href="#" class="p-3 border border-slate-200 rounded-lg hover:border-amber-400 hover:text-amber-600 transition">장난감</a>
                    <a href="#" class="p-3 border border-slate-200 rounded-lg hover:border-amber-400 hover:text-amber-600 transition">산책</a>
                    <a href="#" class="p-3 border border-slate-200 rounded-lg hover:border-amber-400 hover:text-amber-600 transition">미용</a>
                    <a href="#" class="p-3 border border-slate-200 rounded-lg hover:border-amber-400 hover:text-amber-600 transition">배변</a>
                    <a href="#" class="p-3 border border-slate-200 rounded-lg hover:border-amber-400 hover:text-amber-600 transition">하우스</a>
                    <a href="#" class="p-3 border border-slate-200 rounded-lg hover:border-amber-400 hover:text-amber-600 transition">이동장</a>
                </div>
            </div>

            <!-- 카테고리 B -->
            <div>
                <h2 class="text-sm font-bold text-slate-900 bg-slate-100 border border-slate-200 px-3 py-1.5 rounded-md inline-block mb-3">B. 반려인을 위한 생활용품</h2>
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-center text-xs font-semibold">
                    <a href="#" class="p-3 border border-slate-200 rounded-lg hover:border-slate-800 hover:text-slate-900 transition">건강식품</a>
                    <a href="#" class="p-3 border border-slate-200 rounded-lg hover:border-slate-800 hover:text-slate-900 transition">생활용품</a>
                    <a href="#" class="p-3 border border-slate-200 rounded-lg hover:border-slate-800 hover:text-slate-900 transition">주방</a>
                    <a href="#" class="p-3 border border-slate-200 rounded-lg hover:border-slate-800 hover:text-slate-900 transition">욕실</a>
                    <a href="#" class="p-3 border border-slate-200 rounded-lg hover:border-slate-800 hover:text-slate-900 transition">자동차</a>
                    <a href="#" class="p-3 border border-slate-200 rounded-lg hover:border-slate-800 hover:text-slate-900 transition">캠핑</a>
                    <a href="#" class="p-3 border border-slate-200 rounded-lg hover:border-slate-800 hover:text-slate-900 transition">여행</a>
                    <a href="#" class="p-3 border border-slate-200 rounded-lg hover:border-slate-800 hover:text-slate-900 transition">가전</a>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-950 text-slate-400 text-xs py-8 border-t border-slate-800 mt-12">
        <div class="max-w-7xl mx-auto px-4 space-y-3">
            <div class="flex items-center space-x-2">
                <img src="beluna_logo.png" alt="Belluna Pet Logo" class="h-6 w-auto opacity-80">
                <span class="text-slate-200 font-bold">Belluna Pet (벨루나펫 Alpha Version)</span>
            </div>
            <p class="leading-relaxed">Belluna Pet은 한국애견연맹과 협력하여 반려인에게 저렴한 쇼핑과 다양한 혜택을 제공하는 플랫폼입니다.</p>
            <p class="text-slate-600 pt-2">© Belluna Pet. All rights reserved.</p>
        </div>
    </footer>

    <!-- 공통 헤더 스크립트 불러오기 -->
    <script src="header.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // 공통 헤더 렌더링 호출 ('shopping.html'을 전달하여 쇼핑몰 메뉴 활성화)
            renderHeader('shopping.html');
        });
    </script>
</body>
</html>
