<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belluna Pet - 쇼핑몰</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-20">

    <!-- 통합 공통 헤더가 삽입될 위치 -->
    <div id="common-header"></div>

    <main class="max-w-7xl mx-auto px-4 py-8 space-y-8">
        <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 space-y-6">
            <div class="border-b border-slate-100 pb-4">
                <h1 class="text-2xl font-bold text-slate-900">🛍️ 벨루나 쇼핑몰</h1>
                <p class="text-xs text-slate-500 mt-1">친누 쇼핑몰 연동 관리 & 결제 시스템 적용</p>
            </div>

            <!-- 카테고리 A (애견용품) -->
            <div>
                <h2 class="text-sm font-bold text-slate-900 bg-amber-400/20 border border-amber-400/30 px-3 py-1.5 rounded-md inline-block mb-3">A. 애견용품</h2>
                <div class="grid grid-cols-2 sm:grid-cols-6 gap-3 text-center text-xs font-semibold">
                    <a href="#" class="p-3 border rounded-lg transition category-btn-a bg-amber-500 text-white border-amber-500 shadow-xs" data-category="all">전체</a>
                    <a href="#" class="p-3 border border-slate-200 rounded-lg hover:border-amber-400 hover:text-amber-600 transition category-btn-a bg-white text-slate-700" data-category="feed">사료</a>
                    <a href="#" class="p-3 border border-slate-200 rounded-lg hover:border-amber-400 hover:text-amber-600 transition category-btn-a bg-white text-slate-700" data-category="treat">간식</a>
                    <a href="#" class="p-3 border border-slate-200 rounded-lg hover:border-amber-400 hover:text-amber-600 transition category-btn-a bg-white text-slate-700" data-category="supplement">영양제</a>
                    <a href="#" class="p-3 border border-slate-200 rounded-lg hover:border-amber-400 hover:text-amber-600 transition category-btn-a bg-white text-slate-700" data-category="health">건강관리</a>
                    <a href="#" class="p-3 border border-slate-200 rounded-lg hover:border-amber-400 hover:text-amber-600 transition category-btn-a bg-white text-slate-700" data-category="toy">장난감</a>
                    <a href="#" class="p-3 border border-slate-200 rounded-lg hover:border-amber-400 hover:text-amber-600 transition category-btn-a bg-white text-slate-700" data-category="walk">산책</a>
                    <a href="#" class="p-3 border border-slate-200 rounded-lg hover:border-amber-400 hover:text-amber-600 transition category-btn-a bg-white text-slate-700" data-category="grooming">미용</a>
                    <a href="#" class="p-3 border border-slate-200 rounded-lg hover:border-amber-400 hover:text-amber-600 transition category-btn-a bg-white text-slate-700" data-category="toilet">배변</a>
                    <a href="#" class="p-3 border border-slate-200 rounded-lg hover:border-amber-400 hover:text-amber-600 transition category-btn-a bg-white text-slate-700" data-category="house">하우스</a>
                    <a href="#" class="p-3 border border-slate-200 rounded-lg hover:border-amber-400 hover:text-amber-600 transition category-btn-a bg-white text-slate-700" data-category="carrier">이동장</a>
                </div>
            </div>

            <!-- 카테고리 B (반려인을 위한 생활용품) -->
            <div>
                <h2 class="text-sm font-bold text-slate-900 bg-slate-100 border border-slate-200 px-3 py-1.5 rounded-md inline-block mb-3">B. 반려인을 위한 생활용품</h2>
                <div class="grid grid-cols-2 sm:grid-cols-5 gap-3 text-center text-xs font-semibold">
                    <a href="#" class="p-3 border rounded-lg transition category-btn-b bg-slate-900 text-white border-slate-900 shadow-xs" data-category="all">전체</a>
                    <a href="#" class="p-3 border border-slate-200 rounded-lg hover:border-slate-800 hover:text-slate-900 transition category-btn-b bg-white text-slate-700" data-category="human-health">건강식품</a>
                    <a href="#" class="p-3 border border-slate-200 rounded-lg hover:border-slate-800 hover:text-slate-900 transition category-btn-b bg-white text-slate-700" data-category="living">생활용품</a>
                    <a href="#" class="p-3 border border-slate-200 rounded-lg hover:border-slate-800 hover:text-slate-900 transition category-btn-b bg-white text-slate-700" data-category="kitchen">주방</a>
                    <a href="#" class="p-3 border border-slate-200 rounded-lg hover:border-slate-800 hover:text-slate-900 transition category-btn-b bg-white text-slate-700" data-category="bath">욕실</a>
                    <a href="#" class="p-3 border border-slate-200 rounded-lg hover:border-slate-800 hover:text-slate-900 transition category-btn-b bg-white text-slate-700" data-category="car">자동차</a>
                    <a href="#" class="p-3 border border-slate-200 rounded-lg hover:border-slate-800 hover:text-slate-900 transition category-btn-b bg-white text-slate-700" data-category="camping">캠핑</a>
                    <a href="#" class="p-3 border border-slate-200 rounded-lg hover:border-slate-800 hover:text-slate-900 transition category-btn-b bg-white text-slate-700" data-category="travel">여행</a>
                    <a href="#" class="p-3 border border-slate-200 rounded-lg hover:border-slate-800 hover:text-slate-900 transition category-btn-b bg-white text-slate-700" data-category="appliance">가전</a>
                </div>
            </div>
        </section>

        <!-- 분리된 상품 목록 HTML이 동적으로 삽입될 영역 -->
        <div id="product-list-container"></div>
    </main>

    <!-- [추가] 로그인 상태일 때만 노출되는 우측 하단 고정 골라담기 플로팅 버튼 -->
    <div id="cart-floating-container" class="fixed bottom-6 right-6 z-50 hidden">
        <button onclick="openCartModal()" class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-3 rounded-full shadow-lg transition-transform hover:scale-105 font-bold text-xs sm:text-sm">
            <i class="fa-solid fa-basket-shopping text-base"></i>
            <span>골라담기</span>
            <span id="cart-badge" class="bg-white text-blue-600 px-2 py-0.5 rounded-full text-xs font-extrabold shadow-sm">0</span>
        </button>
    </div>

    <!-- [추가] 골라담기 목록 모달 팝업 -->
    <div id="cart-modal" class="fixed inset-0 bg-black/50 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full max-h-[85vh] flex flex-col overflow-hidden">
            <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100">
                <h3 class="text-base font-bold text-slate-900 flex items-center gap-2">
                    <i class="fa-solid fa-basket-shopping text-blue-600"></i> 내 골라담기 목록
                </h3>
                <button onclick="closeCartModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div id="cart-modal-body" class="p-6 overflow-y-auto flex-1 space-y-3 divide-y divide-slate-100">
                <!-- 동적 렌더링 -->
            </div>
            <div class="px-6 py-4 bg-slate-50 border-t border-slate-100 flex items-center justify-between">
                <div>
                    <span class="text-xs text-slate-500 block">총 합계금액</span>
                    <span id="cart-total-price" class="text-base font-extrabold text-blue-600">0원</span>
                </div>
                <div class="flex gap-2">
                    <button onclick="clearCart()" class="px-3 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-xl text-xs font-semibold transition">전체 비우기</button>
                    <button onclick="alert('주문/결제 기능은 준비 중입니다!')" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-semibold transition">주문하기</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-slate-950 text-slate-400 text-xs py-8 border-t border-slate-800 mt-12">
        <div class="max-w-7xl mx-auto px-4 space-y-3">
            <div class="flex items-center space-x-2">
                <span class="text-slate-200 font-bold">Belluna Pet (벨루나펫 Alpha Version)</span>
            </div>
            <p class="leading-relaxed">Belluna Pet은 반려인에게 저렴한 쇼핑과 다양한 혜택을 제공하는 플랫폼입니다.</p>
            <p class="text-slate-600 pt-2">© Belluna Pet. All rights reserved.</p>
        </div>
    </footer>

    <!-- 공통 헤더 스크립트 불러오기 -->
    <script src="header.js"></script>

    <script>
        // 로그인 여부 판단 함수
        function checkIsLoggedIn() {
            return localStorage.getItem('isLoggedIn') === 'true' || sessionStorage.getItem('isLoggedIn') === 'true';
        }

        // --- 골라담기(장바구니) 상태 관리 함수 ---
        function getCart() {
            try {
                return JSON.parse(localStorage.getItem('belluna_cart')) || [];
            } catch (e) {
                return [];
            }
        }

        function saveCart(cart) {
            localStorage.setItem('belluna_cart', JSON.stringify(cart));
            updateCartBadge();
        }

        function addToCart(product) {
            let cart = getCart();
            const existingIndex = cart.findIndex(item => item.name === product.name);
            
            if (existingIndex > -1) {
                cart[existingIndex].quantity = (cart[existingIndex].quantity || 1) + 1;
            } else {
                cart.push({
                    name: product.name,
                    brand: product.brand || 'Belluna Pet',
                    price: Number(product.price),
                    image: product.image || 'https://via.placeholder.com/300',
                    quantity: 1
                });
            }
            
            saveCart(cart);
            alert(`'${product.name}' 상품이 골라담기에 추가되었습니다.`);
        }

        function updateCartBadge() {
            const cart = getCart();
            const totalCount = cart.reduce((sum, item) => sum + (item.quantity || 1), 0);
            const badge = document.getElementById('cart-badge');
            if (badge) badge.innerText = totalCount;
        }

        function openCartModal() {
            renderCartModalList();
            document.getElementById('cart-modal').classList.remove('hidden');
        }

        function closeCartModal() {
            document.getElementById('cart-modal').classList.add('hidden');
        }

        function renderCartModalList() {
            const container = document.getElementById('cart-modal-body');
            const totalPriceEl = document.getElementById('cart-total-price');
            const cart = getCart();

            container.innerHTML = '';

            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-slate-400 text-xs">
                        <i class="fa-solid fa-basket-shopping text-3xl mb-2 block text-slate-300"></i>
                        골라담은 상품이 없습니다.
                    </div>
                `;
                if (totalPriceEl) totalPriceEl.innerText = '0원';
                return;
            }

            let totalPrice = 0;
            cart.forEach((item, index) => {
                const itemTotal = item.price * item.quantity;
                totalPrice += itemTotal;

                const row = document.createElement('div');
                row.className = "pt-3 first:pt-0 flex items-center justify-between gap-3";
                row.innerHTML = `
                    <div class="flex items-center gap-3 overflow-hidden">
                        <img src="${item.image}" alt="${item.name}" class="w-12 h-12 object-cover rounded-lg bg-slate-100 shrink-0">
                        <div class="truncate">
                            <span class="text-[10px] text-blue-600 font-semibold block">${item.brand}</span>
                            <h4 class="text-xs font-bold text-slate-900 truncate">${item.name}</h4>
                            <span class="text-xs text-slate-500">${item.price.toLocaleString()}원 × ${item.quantity}개</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-2 shrink-0">
                        <span class="text-xs font-extrabold text-slate-900">${itemTotal.toLocaleString()}원</span>
                        <button onclick="removeFromCart(${index})" class="text-slate-400 hover:text-red-500 p-1">
                            <i class="fa-solid fa-trash-can text-xs"></i>
                        </button>
                    </div>
                `;
                container.appendChild(row);
            });

            if (totalPriceEl) totalPriceEl.innerText = totalPrice.toLocaleString() + '원';
        }

        function removeFromCart(index) {
            let cart = getCart();
            cart.splice(index, 1);
            saveCart(cart);
            renderCartModalList();
        }

        function clearCart() {
            if (confirm('골라담기 목록을 모두 비우시겠습니까?')) {
                localStorage.removeItem('belluna_cart');
                saveCart([]);
                renderCartModalList();
            }
        }

        document.addEventListener("DOMContentLoaded", function() {
            renderHeader('shopping.html');

            // 로그인 상태 체크 후 골라담기 버튼 노출 처리
            const isLoggedIn = checkIsLoggedIn();
            const cartContainer = document.getElementById('cart-floating-container');
            if (isLoggedIn && cartContainer) {
                cartContainer.classList.remove('hidden');
                updateCartBadge();
            }

            // product-list.html을 비동기로 불러와서 컨테이너에 삽입하고 내부 스크립트 실행
            fetch('product-list.html')
                .then(response => response.text())
                .then(html => {
                    const container = document.getElementById('product-list-container');
                    container.innerHTML = html;

                    // 동적으로 삽입된 HTML 내부에 포함된 script 태그들을 찾아 실행
                    const scripts = container.querySelectorAll('script');
                    scripts.forEach(script => {
                        const newScript = document.createElement('script');
                        if (script.src) {
                            newScript.src = script.src;
                        } else {
                            newScript.text = script.innerHTML;
                        }
                        document.body.appendChild(newScript);
                    });
                })
                .catch(error => {
                    console.error('상품 목록 컴포넌트를 불러오는 중 오류 발생:', error);
                });
        });
    </script>
</body>
</html>
