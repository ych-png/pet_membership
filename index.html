<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belluna Pet Alpha - 메인</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-8">

    <div class="max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-8 pb-4 border-b border-slate-800">
            <h1 class="text-xl font-bold text-amber-400">Belluna Pet 메인 페이지</h1>
            <div class="flex items-center gap-4 text-sm">
                <span id="userGreeting" class="text-slate-300"></span>
                <button onclick="handleSignOut()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg text-xs transition">로그아웃</button>
            </div>
        </header>

        <main>
            <h2 class="text-2xl font-bold mb-4">환영합니다! 서비스 이용이 가능합니다.</h2>
            <p class="text-slate-400">회원 전용 콘텐츠 내용 영역입니다.</p>
        </main>
    </div>

    <script>
        // =========================================================
        // 인증 검사 함수 (localStorage, sessionStorage 모두 체크)
        // =========================================================
        function checkAuth() {
            const localAuth = localStorage.getItem('isLoggedIn');
            const sessionAuth = sessionStorage.getItem('isLoggedIn');

            // 두 스토리지 중 하나라도 'true'이면 로그인으로 인정
            const isLoggedIn = (localAuth === 'true') || (sessionAuth === 'true');

            if (!isLoggedIn) {
                alert('회원 전용 서비스입니다.\n로그인 페이지로 이동합니다.');
                window.location.href = 'login.html';
                return false;
            }

            // 사용자 이름 표시 예시
            const userName = localStorage.getItem('userName') || sessionStorage.getItem('userName') || '회원';
            const userGreeting = document.getElementById('userGreeting');
            if (userGreeting) {
                userGreeting.innerText = `${userName}님`;
            }
            return true;
        }

        // 페이지 로드 시 즉시 인증 검사 실행
        document.addEventListener('DOMContentLoaded', checkAuth);

        // =========================================================
        // 로그아웃 함수
        // =========================================================
        function handleSignOut() {
            // 두 저장소의 인증 관련 Key를 모두 정리
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('userEmail');
            localStorage.removeItem('userName');

            sessionStorage.removeItem('isLoggedIn');
            sessionStorage.removeItem('userEmail');
            sessionStorage.removeItem('userName');

            alert('로그아웃 되었습니다.');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
