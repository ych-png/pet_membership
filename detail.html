<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상품 상세 페이지 - Belluna Pet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; }
    
    /* 상세 설명 안의 이미지가 빈틈없이 밀착되도록 설정 */
    #p-desc img {
        display: block !important;
        margin: 0 auto !important;
        border: none !important;
    }
</style>
</head>
<body class="bg-slate-50 text-slate-800 pb-20">

    <!-- 상단 네비게이션 바 -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
            <a id="back-to-shopping" href="shopping.html" class="font-extrabold text-lg text-blue-600 flex items-center gap-2">
                <i class="fa-solid fa-arrow-left"></i> 쇼핑몰로 돌아가기
            </a>
            <span class="text-xs font-semibold text-slate-500 bg-slate-100 px-3 py-1.5 rounded-full">Belluna Pet Store</span>
        </div>
    </header>

    <!-- 메인 상세 컨텐츠 영역 -->
    <main class="max-w-4xl mx-auto px-4 py-8 space-y-10">
        
        <!-- 상단 기본 정보 섹션 -->
        <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-start">
                
                <!-- 대표 이미지 -->
                <div class="w-full h-80 md:h-96 bg-slate-100 rounded-xl overflow-hidden border border-slate-200 flex items-center justify-center">
                    <img id="p-image" src="" alt="대표 이미지" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/400?text=No+Image';">
                </div>

                <!-- 상품 정보 및 구매 영역 -->
                <div class="flex flex-col justify-between h-full space-y-6">
                    <div class="space-y-3">
                        <span id="p-brand" class="inline-block text-xs font-bold text-blue-600 bg-blue-50 px-2.5 py-1 rounded-md">브랜드명</span>
                        <h1 id="p-name" class="text-xl md:text-2xl font-bold text-slate-900 leading-snug">상품명을 불러오는 중...</h1>
                        <p id="p-price" class="text-2xl font-extrabold text-slate-900 pt-2">0원</p>
                    </div>

                    <div class="space-y-3 pt-4 border-t border-slate-100">
                        <button onclick="alert('결제 연동 준비 중입니다!')" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition shadow-lg shadow-blue-500/20 text-center text-sm">
                            바로 구매하기
                        </button>
                        <!-- 골라담기 추가 버튼 (로그인 체크 로직 연동) -->
                        <button onclick="handleDetailAddToCart()" class="w-full py-3.5 bg-blue-50 text-blue-600 border border-blue-200 font-bold rounded-xl transition text-center text-sm hover:bg-blue-100 flex items-center justify-center gap-2">
                            <i class="fa-solid fa-basket-shopping"></i> 골라담기에 담기
                        </button>
                        <a id="back-to-shopping-btn" href="shopping.html" class="block w-full py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl transition text-center text-sm">
                            목록으로 돌아가기
                        </a>
                    </div>
                </div>

            </div>
        </section>

        <!-- 하단 상세 설명 섹션 -->
        <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8 space-y-4">
            <h2 class="text-lg font-bold text-slate-900 border-b border-slate-100 pb-3">📦 상품 상세 설명</h2>
            <div id="p-desc" class="w-full overflow-hidden">
                <p class="text-slate-400 text-sm py-10 text-center">상세 설명을 불러오는 중입니다...</p>
            </div>
        </section>

    </main>

    <!-- [로그인 상태일 때만 노출] 우측 하단 고정 골라담기 플로팅 버튼 -->
    <div id="cart-floating-container" class="fixed bottom-6 right-6 z-50 hidden">
        <button onclick="openCartModal()" class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-3 rounded-full shadow-lg transition-transform hover:scale-105 font-bold text-xs sm:text-sm">
            <i class="fa-solid fa-basket-shopping text-base"></i>
            <span>골라담기</span>
            <span id="cart-badge" class="bg-white text-blue-600 px-2 py-0.5 rounded-full text-xs font-extrabold shadow-sm">0</span>
        </button>
    </div>

    <!-- 골라담기 목록 모달 팝업 -->
    <div id="cart-modal" class="fixed inset-0 bg-black/50 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full max-h-[85vh] flex flex-col overflow-hidden">
            <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100">
                <h3 class="text-base font-bold text-slate-900 flex items-center gap-2">
                    <i class="fa-solid fa-basket-shopping text-blue-600"></i> 내 골라담기 목록
                </h3>
                <button onclick="closeCartModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div id="cart-modal-body" class="p-6 overflow-y-auto flex-1 space-y-3 divide-y divide-slate-100">
                <!-- 동적 렌더링 -->
            </div>
            <div class="px-6 py-4 bg-slate-50 border-t border-slate-100 flex items-center justify-between">
                <div>
                    <span class="text-xs text-slate-500 block">총 합계금액</span>
                    <span id="cart-total-price" class="text-base font-extrabold text-blue-600">0원</span>
                </div>
                <div class="flex gap-2">
                    <button onclick="clearCart()" class="px-3 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-xl text-xs font-semibold transition">전체 비우기</button>
                    <button onclick="alert('주문/결제 기능은 준비 중입니다!')" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-semibold transition">주문하기</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 데이터 연동 스크립트 -->
    <script>
        // 전역 로그인 상태 체크 함수
        function checkIsLoggedIn() {
            return localStorage.getItem('isLoggedIn') === 'true' || sessionStorage.getItem('isLoggedIn') === 'true';
        }

        // --- 골라담기(장바구니) 관리 전역 함수들 ---
        function getCart() {
            try {
                return JSON.parse(localStorage.getItem('belluna_cart')) || [];
            } catch (e) {
                return [];
            }
        }

        function saveCart(cart) {
            localStorage.setItem('belluna_cart', JSON.stringify(cart));
            updateCartBadge();
        }

        function addToCart(product) {
            let cart = getCart();
            const existingIndex = cart.findIndex(item => item.name === product.name);
            
            if (existingIndex > -1) {
                cart[existingIndex].quantity = (cart[existingIndex].quantity || 1) + 1;
            } else {
                cart.push({
                    name: product.name,
                    brand: product.brand || 'Belluna Pet',
                    price: Number(product.price),
                    image: product.image || 'https://via.placeholder.com/300',
                    quantity: 1
                });
            }
            
            saveCart(cart);
            alert(`'${product.name}' 상품이 골라담기에 추가되었습니다.`);
        }

        function updateCartBadge() {
            const cart = getCart();
            const totalCount = cart.reduce((sum, item) => sum + (item.quantity || 1), 0);
            const badge = document.getElementById('cart-badge');
            if (badge) badge.innerText = totalCount;
        }

        function openCartModal() {
            renderCartModalList();
            document.getElementById('cart-modal').classList.remove('hidden');
        }

        function closeCartModal() {
            document.getElementById('cart-modal').classList.add('hidden');
        }

        function renderCartModalList() {
            const container = document.getElementById('cart-modal-body');
            const totalPriceEl = document.getElementById('cart-total-price');
            const cart = getCart();

            container.innerHTML = '';

            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-slate-400 text-xs">
                        <i class="fa-solid fa-basket-shopping text-3xl mb-2 block text-slate-300"></i>
                        골라담은 상품이 없습니다.
                    </div>
                `;
                if (totalPriceEl) totalPriceEl.innerText = '0원';
                return;
            }

            let totalPrice = 0;
            cart.forEach((item, index) => {
                const itemTotal = item.price * item.quantity;
                totalPrice += itemTotal;

                const row = document.createElement('div');
                row.className = "pt-3 first:pt-0 flex items-center justify-between gap-3";
                row.innerHTML = `
                    <div class="flex items-center gap-3 overflow-hidden">
                        <img src="${item.image}" alt="${item.name}" class="w-12 h-12 object-cover rounded-lg bg-slate-100 shrink-0">
                        <div class="truncate">
                            <span class="text-[10px] text-blue-600 font-semibold block">${item.brand}</span>
                            <h4 class="text-xs font-bold text-slate-900 truncate">${item.name}</h4>
                            <span class="text-xs text-slate-500">${item.price.toLocaleString()}원 × ${item.quantity}개</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-2 shrink-0">
                        <span class="text-xs font-extrabold text-slate-900">${itemTotal.toLocaleString()}원</span>
                        <button onclick="removeFromCart(${index})" class="text-slate-400 hover:text-red-500 p-1">
                            <i class="fa-solid fa-trash-can text-xs"></i>
                        </button>
                    </div>
                `;
                container.appendChild(row);
            });

            if (totalPriceEl) totalPriceEl.innerText = totalPrice.toLocaleString() + '원';
        }

        function removeFromCart(index) {
            let cart = getCart();
            cart.splice(index, 1);
            saveCart(cart);
            renderCartModalList();
        }

        function clearCart() {
            if (confirm('골라담기 목록을 모두 비우시겠습니까?')) {
                localStorage.removeItem('belluna_cart');
                saveCart([]);
                renderCartModalList();
            }
        }

        let currentProduct = null;

        // [수정된 부분] 비로그인 상태일 때 골라담기 담기 시 로그인 페이지로 이동
        function handleDetailAddToCart() {
            if (!checkIsLoggedIn()) {
                alert('로그인이 필요한 서비스입니다. 로그인 페이지로 이동합니다.');
                // 현재 상세 페이지 URL을 redirect 파라미터로 함께 전달하여 로그인 후 다시 돌아올 수 있도록 처리
                const currentUrl = window.location.href;
                window.location.href = `login.html?redirect=${encodeURIComponent(currentUrl)}`;
                return;
            }

            if (currentProduct) {
                addToCart(currentProduct);
            } else {
                alert('상품 정보를 불러오는 중입니다. 잠시 후 다시 시도해 주세요.');
            }
        }

        document.addEventListener("DOMContentLoaded", function() {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');
            
            // 이전 목록 페이지의 상태 파라미터 복원 (page, cat, keyword)
            const returnPage = urlParams.get('page') || '1';
            const returnCat = urlParams.get('cat') || 'all';
            const returnKeyword = urlParams.get('keyword') || '';

            const returnUrl = `shopping.html?page=${returnPage}&cat=${encodeURIComponent(returnCat)}&keyword=${encodeURIComponent(returnKeyword)}`;

            // 돌아가기 버튼들의 href 주소를 이전 상태가 유지되도록 동적 세팅
            const backBtn1 = document.getElementById('back-to-shopping');
            const backBtn2 = document.getElementById('back-to-shopping-btn');
            if (backBtn1) backBtn1.href = returnUrl;
            if (backBtn2) backBtn2.href = returnUrl;

            if (productId === null) {
                alert('잘못된 접근입니다.');
                location.href = returnUrl; 
                return;
            }

            // 로그인 상태 확인 후 플로팅 버튼 노출 제어
            const isLoggedIn = checkIsLoggedIn();
            const cartContainer = document.getElementById('cart-floating-container');
            if (isLoggedIn && cartContainer) {
                cartContainer.classList.remove('hidden');
                updateCartBadge();
            }

            fetch('products.json')
                .then(response => response.json())
                .then(products => {
                    const item = products[productId];
                    
                    if (item) {
                        currentProduct = item; 

                        document.getElementById('p-image').src = item.image;
                        document.getElementById('p-brand').innerText = item.brand;
                        document.getElementById('p-name').innerText = item.name;
                        document.getElementById('p-price').innerText = Number(item.price).toLocaleString() + '원';
                        document.getElementById('p-desc').innerHTML = item.desc;
                        document.title = `${item.name} - Belluna Pet`;
                    } else {
                        alert('존재하지 않는 상품이거나 데이터가 없습니다.');
                        location.href = returnUrl; 
                    }
                })
                .catch(error => {
                    console.error('상품 상세 데이터를 불러오는 중 오류 발생:', error);
                    alert('데이터를 불러오지 못했습니다.');
                });
        });
    </script>
</body>
</html>
