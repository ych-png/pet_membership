<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상품 상세 페이지 - Belluna Pet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-20">

    <!-- 상단 네비게이션 바 -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="shop.html" class="font-extrabold text-lg text-blue-600 flex items-center gap-2">
                <i class="fa-solid fa-arrow-left"></i> 쇼핑몰로 돌아가기
            </a>
            <span class="text-xs font-semibold text-slate-500 bg-slate-100 px-3 py-1.5 rounded-full">Belluna Pet Store</span>
        </div>
    </header>

    <!-- 메인 상세 컨텐츠 영역 -->
    <main class="max-w-4xl mx-auto px-4 py-8 space-y-10">
        
        <!-- 상단 기본 정보 섹션 -->
        <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-start">
                
                <!-- 대표 이미지 -->
                <div class="w-full h-80 md:h-96 bg-slate-100 rounded-xl overflow-hidden border border-slate-200 flex items-center justify-center">
                    <img id="p-image" src="" alt="대표 이미지" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/400?text=No+Image';">
                </div>

                <!-- 상품 정보 및 구매 영역 -->
                <div class="flex flex-col justify-between h-full space-y-6">
                    <div class="space-y-3">
                        <span id="p-brand" class="inline-block text-xs font-bold text-blue-600 bg-blue-50 px-2.5 py-1 rounded-md">브랜드명</span>
                        <h1 id="p-name" class="text-xl md:text-2xl font-bold text-slate-900 leading-snug">상품명을 불러오는 중...</h1>
                        <p id="p-price" class="text-2xl font-extrabold text-slate-900 pt-2">0원</p>
                    </div>

                    <div class="space-y-3 pt-4 border-t border-slate-100">
                        <button onclick="alert('결제 연동 준비 중입니다!')" class="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition shadow-lg shadow-blue-500/20 text-center text-base">
                            바로 구매하기
                        </button>
                        <a href="shopping.html" class="block w-full py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl transition text-center text-sm">
                            목록으로 돌아가기
                        </a>
                    </div>
                </div>

            </div>
        </section>

        <!-- 하단 상세 설명 섹션 (innerHTML로 상세 이미지 12장 출력) -->
        <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8 space-y-4">
            <h2 class="text-lg font-bold text-slate-900 border-b border-slate-100 pb-3">📦 상품 상세 설명</h2>
            <div id="p-desc" class="w-full flex flex-col items-center justify-center space-y-4 overflow-hidden">
                <p class="text-slate-400 text-sm py-10">상세 설명을 불러오는 중입니다...</p>
            </div>
        </section>

    </main>

    <!-- 데이터 연동 스크립트 -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');

            if (productId === null) {
                alert('잘못된 접근입니다.');
                location.href = 'shop.html';
                return;
            }

            fetch('products.json')
                .then(response => response.json())
                .then(products => {
                    const item = products[productId];
                    
                    if (item) {
                        document.getElementById('p-image').src = item.image;
                        document.getElementById('p-brand').innerText = item.brand;
                        document.getElementById('p-name').innerText = item.name;
                        document.getElementById('p-price').innerText = Number(item.price).toLocaleString() + '원';
                        
                        // F행에 있던 HTML 상세 이미지 태그들을 화면에 렌더링
                        document.getElementById('p-desc').innerHTML = item.desc;
                        
                        document.title = `${item.name} - Belluna Pet`;
                    } else {
                        alert('존재하지 않는 상품이거나 데이터가 없습니다.');
                        location.href = 'shop.html';
                    }
                })
                .catch(error => {
                    console.error('상품 상세 데이터를 불러오는 중 오류 발생:', error);
                    alert('데이터를 불러오지 못했습니다.');
                });
        });
    </script>
</body>
</html>
